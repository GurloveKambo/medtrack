<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MediTrack</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FAF7F2; font-family: Georgia, "Palatino Linotype", serif; }
    input, select, textarea, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #E8DFD0; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback } = React;


// ─── Tokens ───────────────────────────────────────────────────────────────────
const P = {
  bg:"#FAF7F2", card:"#FFFFFF", cream:"#F5EFE4", border:"#E8DFD0",
  text:"#2C2416", muted:"#8A7A65",
  green:"#3D8C5F", greenLight:"#EAF5EE",
  amber:"#C07A1A", amberLight:"#FEF3DC",
  red:"#B03030",   redLight:"#FAEAEA",
};
const ACCENTS = ["#3D8C5F","#1A5C8F","#7B4F9E","#C07A1A","#B03030","#2A7F8F","#8F5A2A","#5A7B2A"];

const SLOTS = [
  { id:"morning", label:"Morning",  icon:"🌅", hint:"8 AM"  },
  { id:"noon",    label:"Noon",     icon:"☀️", hint:"1 PM"  },
  { id:"evening", label:"Evening",  icon:"🌆", hint:"6 PM"  },
  { id:"bed",     label:"Bedtime",  icon:"🌙", hint:"9 PM"  },
];
const SLOT_MAP = Object.fromEntries(SLOTS.map(s => [s.id, s]));

// ─── Storage ──────────────────────────────────────────────────────────────────
// categories: [{ id, name, purpose, slots[], accent }]
// medicines:  [{ id, categoryId, name, lotNumber, expiryDate, quantity }]
const KEY   = "meditrack_v7";
const blank = () => ({ categories:[], medicines:[] });
const load  = () => {
  try { const r = localStorage.getItem(KEY); return r ? { ...blank(), ...JSON.parse(r) } : blank(); }
  catch { return blank(); }
};
const persist = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const uid     = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const today   = () => new Date().toISOString().slice(0, 10);

const addDays = (iso, n) => {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};
const fmtDate = iso => {
  if (!iso) return "—";
  return new Date(iso + "T12:00:00").toLocaleDateString("en-AU", {
    day:"numeric", month:"short", year:"numeric"
  });
};
const daysUntil = iso => {
  if (!iso) return null;
  const n = new Date(); n.setHours(0, 0, 0, 0);
  return Math.floor((new Date(iso + "T12:00:00") - n) / 86400000);
};

// ─── Business logic ───────────────────────────────────────────────────────────

// Medicines for a category sorted by earliest expiry first
const catMeds = (medicines, catId) =>
  medicines
    .filter(m => m.categoryId === catId)
    .sort((a, b) => (a.expiryDate || "9999").localeCompare(b.expiryDate || "9999"));

// Total units across all medicines in a category
const totalUnits = (medicines, catId) =>
  catMeds(medicines, catId).reduce((s, m) => s + (Number(m.quantity) || 0), 0);

// Supply info for a category
const supplyInfo = (cat, medicines) => {
  const dpd   = (cat.slots || []).length;
  if (!dpd) return null;
  const total = totalUnits(medicines, cat.id);
  const days  = Math.floor(total / dpd);
  return { dpd, total, days };
};

// Run-out date
const runOutDate = (cat, medicines) => {
  const s = supplyInfo(cat, medicines);
  if (!s || !s.days) return null;
  return addDays(today(), s.days);
};

// Which medicine to currently use (earliest expiry, non-zero quantity)
const activeMed = (medicines, catId) =>
  catMeds(medicines, catId).find(m => (Number(m.quantity) || 0) > 0);

// ─── UI atoms ─────────────────────────────────────────────────────────────────
const Badge = ({ color="muted", children, small }) => {
  const c = {
    green: { bg:P.greenLight, fg:P.green },
    amber: { bg:P.amberLight, fg:P.amber },
    red:   { bg:P.redLight,   fg:P.red   },
    muted: { bg:P.cream,      fg:P.muted },
  }[color] || { bg:P.cream, fg:P.muted };
  return (
    <span style={{ background:c.bg, color:c.fg,
      padding: small ? "2px 8px" : "3px 11px", borderRadius:20,
      fontSize: small ? 11 : 12, fontWeight:700,
      display:"inline-flex", alignItems:"center", gap:3 }}>
      {children}
    </span>
  );
};

const Btn = ({ children, onClick, v="primary", sz="md", disabled, full, style:ex }) => {
  const size = { lg:{f:17,p:"14px 24px"}, md:{f:15,p:"10px 20px"}, sm:{f:13,p:"7px 14px"} }[sz];
  const vars = {
    primary: { bg:P.text,  fg:"#fff", bd:"none" },
    success: { bg:P.green, fg:"#fff", bd:"none" },
    danger:  { bg:P.red,   fg:"#fff", bd:"none" },
    ghost:   { bg:"transparent", fg:P.text, bd:`1.5px solid ${P.border}` },
    subtle:  { bg:P.cream, fg:P.text, bd:"none" },
  }[v];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      fontSize:size.f, padding:size.p, background:vars.bg, color:vars.fg, border:vars.bd,
      borderRadius:12, cursor: disabled ? "not-allowed" : "pointer",
      fontFamily:"inherit", fontWeight:700, display:"inline-flex", alignItems:"center",
      gap:6, opacity: disabled ? 0.5 : 1,
      width: full ? "100%" : "auto", justifyContent:"center", ...ex }}>
      {children}
    </button>
  );
};

const Card = ({ children, style, onClick }) => (
  <div onClick={onClick} style={{
    background:P.card, borderRadius:16, border:`1px solid ${P.border}`,
    boxShadow:"0 2px 8px rgba(0,0,0,0.04)",
    cursor: onClick ? "pointer" : undefined, ...style }}>
    {children}
  </div>
);

const IS = {
  padding:"11px 14px", borderRadius:10, border:`1.5px solid ${P.border}`,
  fontSize:16, fontFamily:"inherit", background:P.bg, color:P.text,
  outline:"none", width:"100%", boxSizing:"border-box",
};

const Inp = ({ label, type="text", value, onChange, placeholder, min, required }) => (
  <label style={{ display:"flex", flexDirection:"column", gap:5 }}>
    <span style={{ fontSize:13, fontWeight:700, color:P.muted, letterSpacing:0.3 }}>
      {label}{required && <span style={{ color:P.red }}> *</span>}
    </span>
    <input type={type} value={value} onChange={e => onChange(e.target.value)}
      placeholder={placeholder} min={min} style={IS}
      onFocus={e => e.target.style.borderColor = P.text}
      onBlur={e  => e.target.style.borderColor = P.border} />
  </label>
);

const Sel = ({ label, value, onChange, options, required }) => (
  <label style={{ display:"flex", flexDirection:"column", gap:5 }}>
    <span style={{ fontSize:13, fontWeight:700, color:P.muted, letterSpacing:0.3 }}>
      {label}{required && <span style={{ color:P.red }}> *</span>}
    </span>
    <select value={value} onChange={e => onChange(e.target.value)} style={IS}>
      {options.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  </label>
);

const Confirm = ({ msg, onYes, onNo }) => (
  <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)",
    display:"flex", alignItems:"center", justifyContent:"center", zIndex:9999, padding:24 }}>
    <Card style={{ padding:28, maxWidth:360, width:"100%", textAlign:"center" }}>
      <div style={{ fontSize:40, marginBottom:12 }}>⚠️</div>
      <p style={{ fontSize:16, marginBottom:24, lineHeight:1.6 }}>{msg}</p>
      <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
        <Btn v="ghost" onClick={onNo}>Cancel</Btn>
        <Btn v="danger" onClick={onYes}>Yes, delete</Btn>
      </div>
    </Card>
  </div>
);

const Empty = ({ icon, title, sub, action }) => (
  <div style={{ textAlign:"center", padding:"40px 16px", color:P.muted }}>
    <div style={{ fontSize:48, marginBottom:10 }}>{icon}</div>
    <div style={{ fontSize:17, fontWeight:700, color:P.text, marginBottom:6 }}>{title}</div>
    <div style={{ fontSize:13, marginBottom:20, lineHeight:1.5 }}>{sub}</div>
    {action}
  </div>
);

const BackBtn = ({ onClick }) => (
  <button onClick={onClick} style={{
    background:"none", border:"none", cursor:"pointer",
    display:"flex", alignItems:"center", gap:4,
    color:P.muted, fontSize:15, fontFamily:"inherit", padding:0 }}>
    ← Back
  </button>
);

const ProgressBar = ({ value, max, color }) => {
  const pct = max > 0 ? Math.max(0, Math.min(100, (value / max) * 100)) : 0;
  return (
    <div style={{ height:5, borderRadius:4, background:P.cream, overflow:"hidden", marginTop:8 }}>
      <div style={{ height:"100%", borderRadius:4, background: color || P.green,
        width:`${pct}%`, transition:"width .3s" }} />
    </div>
  );
};

const SlotPicker = ({ selected, onChange }) => {
  const toggle = id =>
    onChange(selected.includes(id) ? selected.filter(s => s !== id) : [...selected, id]);
  return (
    <div>
      <div style={{ fontSize:13, fontWeight:700, color:P.muted, marginBottom:8, letterSpacing:0.3 }}>
        When to take <span style={{ color:P.red }}>*</span>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        {SLOTS.map(s => {
          const on = selected.includes(s.id);
          return (
            <button key={s.id} onClick={() => toggle(s.id)} style={{
              padding:"14px 8px", borderRadius:14,
              border:`2px solid ${on ? P.text : P.border}`,
              background: on ? P.text : P.card,
              color: on ? "#fff" : P.text,
              cursor:"pointer", fontFamily:"inherit",
              display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
              <span style={{ fontSize:24 }}>{s.icon}</span>
              <span style={{ fontWeight:800, fontSize:14 }}>{s.label}</span>
              <span style={{ fontSize:11, opacity:0.6 }}>{s.hint}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
};

// ─── Supply countdown bar ─────────────────────────────────────────────────────
// Visual: green > 90d, amber 31–90d, red ≤ 30d
const SupplyBar = ({ days, total, runOut }) => {
  const color  = days > 90 ? P.green : days > 30 ? P.amber : P.red;
  const label  = days > 90 ? "green" : days > 30 ? "amber" : "red";
  return (
    <Card style={{ padding:"16px 18px",
      background: label === "red" ? P.redLight : label === "amber" ? P.amberLight : P.greenLight,
      border:`1px solid ${color}` }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end" }}>
        <div>
          <div style={{ fontSize:34, fontWeight:900, color, lineHeight:1 }}>{days}d</div>
          <div style={{ fontSize:12, color:P.muted, marginTop:3 }}>days of supply left</div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:18, fontWeight:800, color:P.text }}>{total} units</div>
          <div style={{ fontSize:12, color:P.muted }}>in stock</div>
        </div>
      </div>
      {runOut && (
        <div style={{ marginTop:10, fontSize:13,
          color: days <= 30 ? P.red : P.muted, fontWeight: days <= 30 ? 700 : 400 }}>
          Runs out: <strong>{fmtDate(runOut)}</strong>
        </div>
      )}
    </Card>
  );
};

// ─── Category Form ─────────────────────────────────────────────────────────────
function CategoryForm({ existing, onSave, onCancel }) {
  const [name,    setName]    = useState(existing?.name    || "");
  const [purpose, setPurpose] = useState(existing?.purpose || "");
  const [slots,   setSlots]   = useState(existing?.slots   || ["morning"]);
  const accent = existing?.accent || ACCENTS[Math.floor(Math.random() * ACCENTS.length)];
  const valid  = name.trim() && slots.length > 0;

  return (
    <div style={{ maxWidth:480, margin:"0 auto" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:24 }}>
        <BackBtn onClick={onCancel} />
        <h2 style={{ fontSize:20, fontWeight:900, margin:0 }}>
          {existing ? "Edit Category" : "New Category"}
        </h2>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
        <Inp label="Category Name" value={name} onChange={setName}
          placeholder="e.g. Blood Pressure" required />
        <Inp label="Purpose / Notes (optional)" value={purpose} onChange={setPurpose}
          placeholder="e.g. Keeps BP under control" />
        <SlotPicker selected={slots} onChange={setSlots} />
        {slots.length === 0 &&
          <div style={{ color:P.red, fontSize:13 }}>⚠ Select at least one time slot.</div>}
      </div>
      <div style={{ display:"flex", gap:12, marginTop:28 }}>
        <Btn v="ghost" onClick={onCancel} full>Cancel</Btn>
        <Btn v="success" onClick={() => valid && onSave({
          id:      existing?.id || uid(),
          name:    name.trim(),
          purpose: purpose.trim(),
          slots, accent,
          createdAt: existing?.createdAt || new Date().toISOString(),
        })} disabled={!valid} full>
          {existing ? "Save Changes" : "Create Category"}
        </Btn>
      </div>
    </div>
  );
}

// ─── Medicine Form ─────────────────────────────────────────────────────────────
function MedicineForm({ categories, existing, defaultCatId, onSave, onCancel }) {
  const initCat = existing?.categoryId || defaultCatId || categories[0]?.id || "";
  const [name,     setName]     = useState(existing?.name       || "");
  const [catId,    setCatId]    = useState(initCat);
  const [lot,      setLot]      = useState(existing?.lotNumber  || "");
  const [expiry,   setExpiry]   = useState(existing?.expiryDate || "");
  const [quantity, setQuantity] = useState(existing?.quantity ? String(existing.quantity) : "");

  const valid = name.trim() && catId && quantity && Number(quantity) > 0;
  const catOptions = categories.map(c => ({ v:c.id, l:c.name }));
  if (!catOptions.length) catOptions.push({ v:"", l:"— Create a category first —" });

  return (
    <div style={{ maxWidth:480, margin:"0 auto" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:24 }}>
        <BackBtn onClick={onCancel} />
        <h2 style={{ fontSize:20, fontWeight:900, margin:0 }}>
          {existing ? "Edit Medicine" : "Add Medicine"}
        </h2>
      </div>

      {!categories.length && (
        <Card style={{ padding:"12px 16px", background:P.amberLight,
          border:`1px solid ${P.amber}`, marginBottom:20 }}>
          <div style={{ fontSize:13, color:P.amber }}>
            ⚠ No categories yet — go to Categories tab and create one first.
          </div>
        </Card>
      )}

      <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
        <Inp label="Medicine Name" value={name} onChange={setName}
          placeholder="e.g. Amlodipine 5mg" required />
        <Sel label="Category" value={catId} onChange={setCatId}
          options={catOptions} required />
        <Inp label="Batch / Lot Number (optional)" value={lot} onChange={setLot}
          placeholder="e.g. LOT-2024-AB12" />
        <Inp label="Expiry Date" type="date" value={expiry} onChange={setExpiry} />
        <Inp label="Quantity on hand (tablets / units)" type="number"
          value={quantity} onChange={setQuantity} min="1" required />
      </div>

      <div style={{ display:"flex", gap:12, marginTop:28 }}>
        <Btn v="ghost" onClick={onCancel} full>Cancel</Btn>
        <Btn v="success" onClick={() => valid && onSave({
          id:         existing?.id || uid(),
          categoryId: catId,
          name:       name.trim(),
          lotNumber:  lot.trim(),
          expiryDate: expiry,
          quantity:   Number(quantity),
          addedAt:    existing?.addedAt || new Date().toISOString(),
        })} disabled={!valid || !categories.length} full>
          {existing ? "Save Changes" : "Add Medicine"}
        </Btn>
      </div>
    </div>
  );
}

// ─── Category Detail ──────────────────────────────────────────────────────────
function CategoryDetail({ cat, medicines, dispatch, onBack, onEditCat, onAddMed, onEditMed }) {
  const [confirm, setConfirm] = useState(null);

  const meds    = catMeds(medicines, cat.id);
  const supply  = supplyInfo(cat, medicines);
  const runOut  = runOutDate(cat, medicines);
  const current = activeMed(medicines, cat.id);
  const slotLabels = (cat.slots || []).map(s => SLOT_MAP[s]?.label).join(" + ");

  return (
    <div style={{ maxWidth:540, margin:"0 auto" }}>
      {confirm?.t === "med" && (
        <Confirm msg={`Delete "${confirm.name}"?`}
          onYes={() => { dispatch({ type:"DEL_MED", id:confirm.id }); setConfirm(null); }}
          onNo={() => setConfirm(null)} />
      )}
      {confirm?.t === "cat" && (
        <Confirm msg={`Delete "${cat.name}" and all its medicines?`}
          onYes={() => { dispatch({ type:"DEL_CAT", id:cat.id }); onBack(); }}
          onNo={() => setConfirm(null)} />
      )}

      {/* Header */}
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20 }}>
        <BackBtn onClick={onBack} />
        <div style={{ flex:1 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <div style={{ width:12, height:12, borderRadius:"50%",
              background: cat.accent || P.green, flexShrink:0 }} />
            <h2 style={{ fontSize:20, fontWeight:900, margin:0 }}>{cat.name}</h2>
          </div>
          {cat.purpose && (
            <div style={{ fontSize:13, color:P.muted, marginTop:2, marginLeft:20 }}>
              {cat.purpose}
            </div>
          )}
        </div>
        <Btn v="ghost" sz="sm" onClick={() => onEditCat(cat)}>Edit</Btn>
        <Btn v="danger" sz="sm" onClick={() => setConfirm({ t:"cat" })}>🗑</Btn>
      </div>

      {/* Supply bar */}
      {supply
        ? <div style={{ marginBottom:16 }}>
            <SupplyBar days={supply.days} total={supply.total} runOut={runOut} />
            <div style={{ fontSize:12, color:P.muted, marginTop:6, textAlign:"right" }}>
              {supply.dpd} dose{supply.dpd > 1 ? "s" : ""}/day · {slotLabels}
            </div>
          </div>
        : <Card style={{ padding:"14px 16px", marginBottom:16, background:P.cream }}>
            <div style={{ fontSize:14, color:P.muted }}>No medicines added yet.</div>
          </Card>
      }

      {/* Currently open */}
      {current && (
        <Card style={{ padding:"14px 16px", marginBottom:16, border:`2px solid ${P.green}` }}>
          <div style={{ fontSize:11, fontWeight:800, color:P.green, letterSpacing:0.8, marginBottom:6 }}>
            🟢 TAKE FROM THIS NOW
          </div>
          <div style={{ fontWeight:800, fontSize:16 }}>{current.name}</div>
          {current.lotNumber && (
            <div style={{ fontSize:13, color:P.muted, marginTop:2 }}>
              Lot: <strong style={{ color:P.text }}>{current.lotNumber}</strong>
            </div>
          )}
          <div style={{ fontSize:13, color:P.muted, marginTop:4, display:"flex", gap:14, flexWrap:"wrap" }}>
            <span>Expiry: <strong style={{ color:P.text }}>{fmtDate(current.expiryDate)}</strong></span>
            <span>Qty: <strong style={{ color:P.text }}>{current.quantity} units</strong></span>
          </div>
        </Card>
      )}

      {/* All medicines in expiry order */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
        <div style={{ fontSize:11, fontWeight:800, color:P.muted, letterSpacing:0.8 }}>
          ALL STOCK — EARLIEST EXPIRY FIRST
        </div>
        <Btn v="subtle" sz="sm" onClick={() => onAddMed(cat)}>+ Add</Btn>
      </div>

      {meds.length === 0 ? (
        <Empty icon="💊" title="No medicines yet"
          sub="Add medicines to start tracking stock."
          action={<Btn v="primary" onClick={() => onAddMed(cat)}>+ Add Medicine</Btn>} />
      ) : meds.map((med, idx) => {
        const d = daysUntil(med.expiryDate);
        const expColor = d === null ? "muted" : d < 0 ? "red" : d <= 30 ? "red" : d <= 90 ? "amber" : "green";
        const isCurrent = med.id === current?.id;

        return (
          <Card key={med.id} style={{ padding:"14px 16px", marginBottom:10,
            borderLeft:`4px solid ${isCurrent ? P.green : P.amber}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:5 }}>
                  <span style={{ fontSize:12, fontWeight:800, color:P.muted,
                    background:P.cream, borderRadius:6, padding:"1px 7px" }}>
                    #{idx + 1}
                  </span>
                  <span style={{ fontWeight:800, fontSize:15 }}>{med.name}</span>
                  {isCurrent && <Badge color="green" small>🟢 Current</Badge>}
                  {d !== null && (
                    <Badge color={expColor} small>
                      {d < 0 ? `Expired ${Math.abs(d)}d ago`
                        : d === 0 ? "Expires today"
                        : `Exp ${d}d`}
                    </Badge>
                  )}
                </div>
                <div style={{ fontSize:13, color:P.muted, display:"flex", gap:14, flexWrap:"wrap" }}>
                  {med.lotNumber && <span>Lot: <strong style={{ color:P.text }}>{med.lotNumber}</strong></span>}
                  <span>Expiry: <strong style={{ color:P.text }}>{fmtDate(med.expiryDate)}</strong></span>
                  <span>Qty: <strong style={{ color:P.text }}>{med.quantity} units</strong></span>
                </div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:6, flexShrink:0 }}>
                <Btn v="ghost" sz="sm" onClick={() => onEditMed(med, cat)}>✏️</Btn>
                <Btn v="ghost" sz="sm"
                  onClick={() => setConfirm({ t:"med", id:med.id, name:med.name })}>🗑</Btn>
              </div>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

// ─── Categories list screen ───────────────────────────────────────────────────
function CategoriesScreen({ categories, medicines, onSelect, onAdd }) {
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
        <h2 style={{ fontSize:22, fontWeight:900, margin:0 }}>Categories</h2>
        <Btn v="primary" sz="sm" onClick={onAdd}>+ New</Btn>
      </div>

      {categories.length === 0 ? (
        <Empty icon="🗂️" title="No categories yet"
          sub={'Create a category like "Blood Pressure" to group medicines by purpose.'}
          action={<Btn v="primary" onClick={onAdd}>+ Create Category</Btn>} />
      ) : categories.map(cat => {
        const supply  = supplyInfo(cat, medicines);
        const runOut  = runOutDate(cat, medicines);
        const current = activeMed(medicines, cat.id);
        const supDays = supply?.days ?? 0;
        const supColor = supDays > 90 ? "green" : supDays > 30 ? "amber" : supply ? "red" : "muted";
        const slotIcons = (cat.slots || []).map(s => SLOT_MAP[s]?.icon).join(" ");
        const medCount  = medicines.filter(m => m.categoryId === cat.id).length;

        return (
          <Card key={cat.id} onClick={() => onSelect(cat)}
            style={{ padding:"16px 18px", marginBottom:12, cursor:"pointer",
              borderLeft:`4px solid ${cat.accent || P.green}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
              <div style={{ flex:1 }}>
                {/* Name + supply badge */}
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:4 }}>
                  <span style={{ fontWeight:900, fontSize:17 }}>{cat.name}</span>
                  {supply
                    ? <Badge color={supColor} small>{supply.days}d · {supply.total} units</Badge>
                    : <Badge color="muted" small>No stock</Badge>}
                </div>

                {cat.purpose && (
                  <div style={{ fontSize:13, color:P.muted, marginBottom:5 }}>{cat.purpose}</div>
                )}

                {/* Current medicine */}
                {current && (
                  <div style={{ fontSize:13, color:P.green, fontWeight:700, marginBottom:2 }}>
                    🟢 {current.name}
                    {current.lotNumber && ` · Lot ${current.lotNumber}`}
                    {" "}· {current.quantity} units
                  </div>
                )}

                {/* Run-out + meta */}
                <div style={{ fontSize:12, color: supDays <= 30 && supply ? P.red : P.muted, marginTop:3 }}>
                  {runOut && <>Runs out: <strong>{fmtDate(runOut)}</strong> · </>}
                  {medCount} pack{medCount !== 1 ? "s" : ""} · {slotIcons}
                </div>
              </div>
              <span style={{ fontSize:20, color:P.muted, alignSelf:"center" }}>›</span>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

// ─── Medicines screen ─────────────────────────────────────────────────────────
function MedicinesScreen({ medicines, categories, onAdd, onEdit, onDelete }) {
  const [search,    setSearch]    = useState("");
  const [filterCat, setFilterCat] = useState("all");
  const [confirm,   setConfirm]   = useState(null);

  const catOptions = [
    { v:"all", l:"All" },
    ...categories.map(c => ({ v:c.id, l:c.name })),
  ];
  const getCat = id => categories.find(c => c.id === id);

  const filtered = medicines
    .filter(m => {
      const matchSearch = !search
        || m.name.toLowerCase().includes(search.toLowerCase())
        || m.lotNumber?.toLowerCase().includes(search.toLowerCase());
      const matchCat = filterCat === "all" || m.categoryId === filterCat;
      return matchSearch && matchCat;
    })
    .sort((a, b) => (a.expiryDate || "9999").localeCompare(b.expiryDate || "9999"));

  return (
    <div>
      {confirm && (
        <Confirm msg={`Delete "${confirm.name}"?`}
          onYes={() => { onDelete(confirm.id); setConfirm(null); }}
          onNo={() => setConfirm(null)} />
      )}

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <h2 style={{ fontSize:22, fontWeight:900, margin:0 }}>Medicines</h2>
        <Btn v="primary" sz="sm" onClick={onAdd}>+ Add</Btn>
      </div>

      <input value={search} onChange={e => setSearch(e.target.value)}
        placeholder="🔍 Search name or lot number…"
        style={{ ...IS, marginBottom:10 }} />

      {/* Category filter */}
      <div style={{ display:"flex", gap:8, marginBottom:16, overflowX:"auto", paddingBottom:4 }}>
        {catOptions.map(o => (
          <button key={o.v} onClick={() => setFilterCat(o.v)} style={{
            padding:"6px 14px", borderRadius:20, border:`1.5px solid ${P.border}`,
            background: filterCat === o.v ? P.text : P.card,
            color: filterCat === o.v ? "#fff" : P.muted,
            fontWeight:700, cursor:"pointer", whiteSpace:"nowrap",
            fontSize:13, fontFamily:"inherit", flexShrink:0 }}>
            {o.l}
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <Empty icon="💊" title="No medicines found"
          sub="Add a medicine or try a different filter."
          action={<Btn v="primary" onClick={onAdd}>+ Add Medicine</Btn>} />
      ) : filtered.map(med => {
        const cat = getCat(med.categoryId);
        const d   = daysUntil(med.expiryDate);
        const expColor = d === null ? "muted" : d < 0 ? "red" : d <= 30 ? "red" : d <= 90 ? "amber" : "green";

        return (
          <Card key={med.id} style={{ padding:"14px 16px", marginBottom:10,
            borderLeft:`4px solid ${cat?.accent || P.muted}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:5 }}>
                  <span style={{ fontWeight:800, fontSize:15 }}>{med.name}</span>
                  {d !== null && (
                    <Badge color={expColor} small>
                      {d < 0 ? `Expired ${Math.abs(d)}d ago`
                        : d === 0 ? "Expires today"
                        : `Exp ${d}d`}
                    </Badge>
                  )}
                </div>
                {cat && (
                  <div style={{ fontSize:12, fontWeight:700,
                    color: cat.accent || P.muted, marginBottom:4 }}>
                    ● {cat.name}
                  </div>
                )}
                <div style={{ fontSize:13, color:P.muted, display:"flex", gap:14, flexWrap:"wrap" }}>
                  {med.lotNumber && (
                    <span>Lot: <strong style={{ color:P.text }}>{med.lotNumber}</strong></span>
                  )}
                  <span>Expiry: <strong style={{ color:P.text }}>{fmtDate(med.expiryDate)}</strong></span>
                  <span>Qty: <strong style={{ color:P.text }}>{med.quantity} units</strong></span>
                </div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:6, flexShrink:0 }}>
                <Btn v="ghost" sz="sm" onClick={() => onEdit(med)}>✏️</Btn>
                <Btn v="ghost" sz="sm"
                  onClick={() => setConfirm({ id:med.id, name:med.name })}>🗑</Btn>
              </div>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

// ─── Today screen ─────────────────────────────────────────────────────────────
function TodayScreen({ categories, medicines, goToCat }) {
  const nowH      = new Date().getHours();
  const curSlotId = nowH < 12 ? "morning" : nowH < 16 ? "noon" : nowH < 20 ? "evening" : "bed";

  // Only categories that have at least one slot scheduled
  const scheduled = categories.filter(c => (c.slots || []).length > 0);

  // Alerts: supply ≤ 30 days
  const alerts = scheduled.filter(cat => {
    const s = supplyInfo(cat, medicines);
    return s && s.days <= 30;
  });

  // Group categories by slot for the schedule grid
  const grouped = SLOTS.map(slot => ({
    slot,
    cats: scheduled.filter(c => c.slots.includes(slot.id)),
  })).filter(g => g.cats.length > 0);

  return (
    <div>
      {/* Header */}
      <div style={{ background:P.text, color:"#fff", padding:"22px 20px 28px",
        borderRadius:"0 0 24px 24px", marginBottom:20 }}>
        <div style={{ fontSize:13, opacity:0.6, marginBottom:4 }}>
          {new Date().toLocaleDateString("en-AU", { weekday:"long", day:"numeric", month:"long" })}
        </div>
        <div style={{ fontSize:26, fontWeight:900 }}>Daily Schedule</div>
        <div style={{ fontSize:13, opacity:0.7, marginTop:4 }}>
          {scheduled.length} categor{scheduled.length !== 1 ? "ies" : "y"} · taking medicines regularly
        </div>
      </div>

      {/* Low supply alerts */}
      {alerts.map(cat => {
        const s   = supplyInfo(cat, medicines);
        const run = runOutDate(cat, medicines);
        return (
          <Card key={cat.id} style={{ padding:"10px 14px", marginBottom:10,
            background:P.redLight, border:`1px solid ${P.red}` }}>
            <div style={{ fontSize:14, color:P.red, lineHeight:1.5 }}>
              ⚠ <strong>{cat.name}</strong> — only <strong>{s.days} days</strong> supply left.
              {run && <> Runs out <strong>{fmtDate(run)}</strong>.</>}
            </div>
          </Card>
        );
      })}

      {/* Schedule */}
      {grouped.length === 0 ? (
        <Empty icon="💊" title="Nothing scheduled"
          sub="Create a category and set a schedule to see it here." />
      ) : grouped.map(({ slot, cats }) => (
        <div key={slot.id} style={{ marginBottom:28 }}>
          {/* Slot header */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10,
            paddingBottom:8, borderBottom:`1px solid ${P.border}` }}>
            <span style={{ fontSize:22 }}>{slot.icon}</span>
            <div>
              <span style={{ fontWeight:900, fontSize:16,
                color: slot.id === curSlotId ? P.text : P.muted }}>
                {slot.label}
              </span>
              <span style={{ fontSize:13, color:P.muted, marginLeft:6 }}>{slot.hint}</span>
            </div>
            {slot.id === curSlotId && (
              <Badge color="green" small>Now</Badge>
            )}
          </div>

          {/* Category cards for this slot */}
          {cats.map(cat => {
            const supply  = supplyInfo(cat, medicines);
            const runOut  = runOutDate(cat, medicines);
            const current = activeMed(medicines, cat.id);
            const supDays = supply?.days ?? 0;

            return (
              <Card key={cat.id} onClick={() => goToCat(cat)}
                style={{ padding:"14px 16px", marginBottom:10, cursor:"pointer",
                  borderLeft:`4px solid ${cat.accent || P.green}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                  <div style={{ flex:1 }}>
                    {/* Category name */}
                    <div style={{ fontWeight:900, fontSize:16, marginBottom:4 }}>
                      {cat.name}
                    </div>

                    {/* Which medicine to take */}
                    {current ? (
                      <div style={{ fontSize:14, color:P.text, marginBottom:6 }}>
                        💊 <strong>{current.name}</strong>
                        {current.lotNumber && (
                          <span style={{ color:P.muted, fontWeight:400 }}> · Lot {current.lotNumber}</span>
                        )}
                      </div>
                    ) : (
                      <div style={{ fontSize:13, color:P.red, marginBottom:6 }}>
                        ⚠ No stock available
                      </div>
                    )}

                    {/* Supply + run-out */}
                    {supply ? (
                      <div style={{ fontSize:13,
                        color: supDays <= 30 ? P.red : supDays <= 90 ? P.amber : P.muted,
                        fontWeight: supDays <= 30 ? 700 : 400 }}>
                        {supply.total} units · {supply.days}d supply
                        {runOut && <> · Runs out <strong>{fmtDate(runOut)}</strong></>}
                      </div>
                    ) : (
                      <div style={{ fontSize:13, color:P.muted }}>No stock entered</div>
                    )}
                  </div>
                  <span style={{ fontSize:20, color:P.muted, alignSelf:"center" }}>›</span>
                </div>
              </Card>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ─── Settings ─────────────────────────────────────────────────────────────────
function SettingsView({ data, dispatch }) {
  const [confirmClear, setConfirmClear] = useState(false);

  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = `meditrack_${today()}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const importData = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try { dispatch({ type:"IMPORT", p:JSON.parse(ev.target.result) }); alert("Imported!"); }
      catch { alert("Could not read backup file."); }
    };
    r.readAsText(file);
  };

  return (
    <div>
      {confirmClear && (
        <Confirm msg="Delete ALL data? This cannot be undone."
          onYes={() => { dispatch({ type:"CLEAR" }); setConfirmClear(false); }}
          onNo={() => setConfirmClear(false)} />
      )}
      <h2 style={{ fontSize:22, fontWeight:900, marginBottom:20 }}>Settings</h2>
      <Card style={{ padding:"16px 20px", marginBottom:14 }}>
        <div style={{ fontWeight:800, fontSize:15, marginBottom:14 }}>Backup & Restore</div>
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <Btn v="subtle" onClick={exportData} full>⬇️ Export Backup (JSON)</Btn>
          <label style={{ display:"flex", flexDirection:"column", gap:5 }}>
            <span style={{ fontSize:13, fontWeight:700, color:P.muted }}>Import from backup</span>
            <input type="file" accept=".json" onChange={importData}
              style={{ fontSize:14, fontFamily:"inherit" }} />
          </label>
          <Btn v="danger" onClick={() => setConfirmClear(true)} full>🗑 Clear All Data</Btn>
        </div>
      </Card>
      <Card style={{ padding:"16px 20px", background:P.cream }}>
        <div style={{ fontSize:13, color:P.muted, lineHeight:1.7 }}>
          <strong>How stock works:</strong> Enter quantities on hand. The app calculates
          how many days supply you have based on doses per day, and shows which medicine
          to use first (earliest expiry).<br /><br />
          <strong>Privacy:</strong> All data stays on this device only.<br /><br />
          <strong>Disclaimer:</strong> For personal tracking only. Always follow your doctor's
          or pharmacist's instructions.
        </div>
      </Card>
    </div>
  );
}

// ─── Bottom Nav ───────────────────────────────────────────────────────────────
const NAV = [
  { id:"today",      icon:"🏠", label:"Today"      },
  { id:"categories", icon:"🗂️", label:"Categories" },
  { id:"medicines",  icon:"💊", label:"Medicines"  },
  { id:"settings",   icon:"⚙️", label:"Settings"   },
];

function BottomNav({ active, setActive }) {
  return (
    <nav style={{ position:"fixed", bottom:0, left:0, right:0, background:P.card,
      borderTop:`1px solid ${P.border}`, display:"flex", justifyContent:"space-around",
      padding:"8px 0 12px", zIndex:100, maxWidth:600, margin:"0 auto" }}>
      {NAV.map(n => (
        <button key={n.id} onClick={() => setActive(n.id)} style={{
          display:"flex", flexDirection:"column", alignItems:"center", gap:3,
          background:"none", border:"none", cursor:"pointer", padding:"4px 10px",
          color: active === n.id ? P.text : P.muted, fontFamily:"inherit" }}>
          <span style={{ fontSize:20 }}>{n.icon}</span>
          <span style={{ fontSize:10, fontWeight: active === n.id ? 800 : 500 }}>{n.label}</span>
          {active === n.id && (
            <div style={{ width:20, height:3, borderRadius:2, background:P.text, marginTop:1 }} />
          )}
        </button>
      ))}
    </nav>
  );
}

// ─── Reducer ──────────────────────────────────────────────────────────────────
function reducer(state, action) {
  let next;
  switch (action.type) {
    case "ADD_CAT":
      next = { ...state, categories:[...state.categories, action.cat] }; break;
    case "UPD_CAT":
      next = { ...state, categories:state.categories.map(c => c.id === action.cat.id ? action.cat : c) }; break;
    case "DEL_CAT":
      next = { ...state,
        categories: state.categories.filter(c => c.id !== action.id),
        medicines:  state.medicines.filter(m => m.categoryId !== action.id) }; break;
    case "ADD_MED":
      next = { ...state, medicines:[...state.medicines, action.med] }; break;
    case "UPD_MED":
      next = { ...state, medicines:state.medicines.map(m => m.id === action.med.id ? action.med : m) }; break;
    case "DEL_MED":
      next = { ...state, medicines:state.medicines.filter(m => m.id !== action.id) }; break;
    case "IMPORT":
      next = { ...blank(), ...action.p }; break;
    case "CLEAR":
      next = blank(); break;
    default:
      return state;
  }
  persist(next);
  return next;
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(() => load());
  const [tab,  setTab]  = useState("today");
  const [view, setView] = useState(null);
  // view shapes:
  //   { s:"add_cat" } | { s:"edit_cat", cat }
  //   { s:"cat_detail", catId }
  //   { s:"add_med", defaultCatId? } | { s:"edit_med", med }

  const act  = useCallback(action => setData(prev => reducer(prev, action)), []);
  const back = () => setView(null);

  const wrap = children => (
    <div style={{ fontFamily:"'Georgia','Palatino Linotype',serif",
      background:P.bg, minHeight:"100vh", color:P.text, maxWidth:600, margin:"0 auto" }}>
      <div style={{ padding:"20px 16px 40px" }}>{children}</div>
    </div>
  );

  if (view) {
    const { s } = view;

    if (s === "add_cat" || s === "edit_cat") return wrap(
      <CategoryForm existing={view.cat}
        onSave={cat => { act({ type: view.cat ? "UPD_CAT" : "ADD_CAT", cat }); back(); }}
        onCancel={back} />
    );

    if (s === "add_med" || s === "edit_med") return wrap(
      <MedicineForm categories={data.categories} existing={view.med}
        defaultCatId={view.defaultCatId}
        onSave={med => { act({ type: view.med ? "UPD_MED" : "ADD_MED", med }); back(); }}
        onCancel={back} />
    );

    if (s === "cat_detail") {
      const cat = data.categories.find(c => c.id === view.catId);
      if (!cat) { back(); return null; }
      return wrap(
        <CategoryDetail cat={cat} medicines={data.medicines} dispatch={act}
          onBack={back}
          onEditCat={c   => setView({ s:"edit_cat", cat:c })}
          onAddMed={c    => setView({ s:"add_med", defaultCatId:c.id })}
          onEditMed={med => setView({ s:"edit_med", med })} />
      );
    }
  }

  const content = () => {
    if (tab === "today") return (
      <TodayScreen categories={data.categories} medicines={data.medicines}
        goToCat={cat => setView({ s:"cat_detail", catId:cat.id })} />
    );
    if (tab === "categories") return (
      <CategoriesScreen categories={data.categories} medicines={data.medicines}
        onSelect={cat => setView({ s:"cat_detail", catId:cat.id })}
        onAdd={() => setView({ s:"add_cat" })} />
    );
    if (tab === "medicines") return (
      <MedicinesScreen medicines={data.medicines} categories={data.categories}
        onAdd={() => setView({ s:"add_med" })}
        onEdit={med => setView({ s:"edit_med", med })}
        onDelete={id => act({ type:"DEL_MED", id })} />
    );
    if (tab === "settings") return (
      <SettingsView data={data} dispatch={act} />
    );
  };

  return (
    <div style={{ fontFamily:"'Georgia','Palatino Linotype',serif",
      background:P.bg, minHeight:"100vh", color:P.text, maxWidth:600, margin:"0 auto" }}>
      <div style={{ padding:"20px 16px 90px" }}>{content()}</div>
      <BottomNav active={tab} setActive={setTab} />
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
