<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>MediTrack</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#FAF7F2;font-family:Georgia,"Palatino Linotype",serif;}
    input,select,textarea,button{font-family:inherit;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback} = React;

// ── Tokens ────────────────────────────────────────────────────────────────────
const P = {
  bg:"#FAF7F2",card:"#FFFFFF",cream:"#F5EFE4",border:"#E8DFD0",
  text:"#2C2416",muted:"#8A7A65",
  green:"#3D8C5F",greenLight:"#EAF5EE",
  amber:"#C07A1A",amberLight:"#FEF3DC",
  red:"#B03030",redLight:"#FAEAEA",
  blue:"#1A5C8F",blueLight:"#E8F2FA",
};
const ACCENTS=["#3D8C5F","#1A5C8F","#7B4F9E","#C07A1A","#B03030","#2A7F8F","#8F5A2A","#5A7B2A"];

const SLOTS=[
  {id:"morning",label:"Morning", icon:"🌅",hint:"8 AM"},
  {id:"noon",   label:"Noon",    icon:"☀️",hint:"1 PM"},
  {id:"evening",label:"Evening", icon:"🌆",hint:"6 PM"},
  {id:"bed",    label:"Bedtime", icon:"🌙",hint:"9 PM"},
];
const SLOT_MAP=Object.fromEntries(SLOTS.map(s=>[s.id,s]));

// Mon–Sun display order; id = JS getDay() value
const DAYS=[
  {id:1,s:"Mon"},{id:2,s:"Tue"},{id:3,s:"Wed"},
  {id:4,s:"Thu"},{id:5,s:"Fri"},{id:6,s:"Sat"},{id:0,s:"Sun"},
];
const ALL_DAYS=[0,1,2,3,4,5,6];

// ── Storage ───────────────────────────────────────────────────────────────────
// prescriptions: [{id,saltName,condition,doctorName,schedule:[{slotId,days:[]}],accent}]
// stock:         [{id,prescriptionId,brandName,lotNumber,expiryDate,quantity,enteredDate}]
// logs:          [{id,logKey,prescriptionId,date,slotId,takenAt,status}]
// settings:      {trackingMode:"assume"|"confirm"}
const KEY="meditrack_v9";
const blank=()=>({prescriptions:[],stock:[],logs:[],settings:{trackingMode:"assume"}});
const load=()=>{try{const r=localStorage.getItem(KEY);return r?{...blank(),...JSON.parse(r)}:blank();}catch{return blank();}};
const persist=d=>{try{localStorage.setItem(KEY,JSON.stringify(d));}catch{}};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const fmtDate=iso=>{if(!iso)return"—";return new Date(iso+"T12:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});};
const daysUntil=iso=>{if(!iso)return null;const n=new Date();n.setHours(0,0,0,0);return Math.floor((new Date(iso+"T12:00:00")-n)/86400000);};

// ── Business logic ─────────────────────────────────────────────────────────────

// Schedule entries for today's day-of-week
const todayEntries=rx=>{
  const dow=new Date().getDay();
  return (rx.schedule||[]).filter(e=>e.days.includes(dow));
};

// Doses per week across all slots+days
const dosesPerWeek=rx=>(rx.schedule||[]).reduce((s,e)=>s+e.days.length,0);

// Count scheduled doses from a date string (inclusive) to yesterday (exclusive of today)
const dosesConsumedSince=(rx,fromIso)=>{
  const start=new Date(fromIso+"T00:00:00");
  const end=new Date(); end.setHours(0,0,0,0);
  const sched=rx.schedule||[];
  let count=0;
  for(let d=new Date(start);d<end;d.setDate(d.getDate()+1)){
    const dow=d.getDay();
    sched.forEach(e=>{if(e.days.includes(dow))count++;});
  }
  return count;
};

// Effective quantity: assume mode subtracts consumed since entry date
const effectiveQty=(rx,item,mode)=>{
  if(mode==="confirm") return Number(item.quantity)||0;
  const consumed=dosesConsumedSince(rx,item.enteredDate||item.addedAt?.slice(0,10)||today());
  return Math.max(0,(Number(item.quantity)||0)-consumed);
};

// Stock for a prescription, earliest expiry first
const rxStock=(stock,rxId)=>
  stock.filter(s=>s.prescriptionId===rxId)
       .sort((a,b)=>(a.expiryDate||"9999").localeCompare(b.expiryDate||"9999"));

const totalEffective=(rx,stock,mode)=>
  rxStock(stock,rx.id).reduce((s,item)=>s+effectiveQty(rx,item,mode),0);

const supplyInfo=(rx,stock,mode)=>{
  const dpw=dosesPerWeek(rx); if(!dpw)return null;
  const total=totalEffective(rx,stock,mode);
  return{dpw,total,days:Math.floor(total*7/dpw)};
};

const runOutDate=(rx,stock,mode)=>{
  const s=supplyInfo(rx,stock,mode); if(!s||!s.days)return null;
  return addDays(today(),s.days);
};

const activeStock=(rx,stock,mode)=>
  rxStock(stock,rx.id).find(item=>effectiveQty(rx,item,mode)>0);

// Human-readable schedule summary
const schedSummary=rx=>{
  const sched=rx.schedule||[];
  if(!sched.length)return"Not scheduled";
  return sched.map(e=>{
    const slot=SLOT_MAP[e.slotId];
    const allD=e.days.length===7;
    const dayStr=allD?"daily":e.days.map(d=>DAYS.find(x=>x.id===d)?.s).filter(Boolean).join(", ");
    return `${slot?.label} ${dayStr}`;
  }).join(" · ");
};

// ── Atoms ─────────────────────────────────────────────────────────────────────
const Badge=({color="muted",children,small})=>{
  const c={green:{bg:P.greenLight,fg:P.green},amber:{bg:P.amberLight,fg:P.amber},
    red:{bg:P.redLight,fg:P.red},blue:{bg:P.blueLight,fg:P.blue},
    muted:{bg:P.cream,fg:P.muted}}[color]||{bg:P.cream,fg:P.muted};
  return <span style={{background:c.bg,color:c.fg,padding:small?"2px 8px":"3px 11px",
    borderRadius:20,fontSize:small?11:12,fontWeight:700,display:"inline-flex",alignItems:"center",gap:3}}>
    {children}</span>;
};

const Btn=({children,onClick,v="primary",sz="md",disabled,full,style:ex})=>{
  const size={lg:{f:17,p:"14px 24px"},md:{f:15,p:"10px 20px"},sm:{f:13,p:"7px 14px"}}[sz];
  const vars={primary:{bg:P.text,fg:"#fff",bd:"none"},success:{bg:P.green,fg:"#fff",bd:"none"},
    danger:{bg:P.red,fg:"#fff",bd:"none"},blue:{bg:P.blue,fg:"#fff",bd:"none"},
    ghost:{bg:"transparent",fg:P.text,bd:`1.5px solid ${P.border}`},
    subtle:{bg:P.cream,fg:P.text,bd:"none"}}[v];
  return <button onClick={onClick} disabled={disabled} style={{fontSize:size.f,padding:size.p,
    background:vars.bg,color:vars.fg,border:vars.bd,borderRadius:12,
    cursor:disabled?"not-allowed":"pointer",fontFamily:"inherit",fontWeight:700,
    display:"inline-flex",alignItems:"center",gap:6,opacity:disabled?0.5:1,
    width:full?"100%":"auto",justifyContent:"center",...ex}}>{children}</button>;
};

const Card=({children,style,onClick})=>
  <div onClick={onClick} style={{background:P.card,borderRadius:16,border:`1px solid ${P.border}`,
    boxShadow:"0 2px 8px rgba(0,0,0,0.04)",cursor:onClick?"pointer":undefined,...style}}>
    {children}</div>;

const IS={padding:"11px 14px",borderRadius:10,border:`1.5px solid ${P.border}`,
  fontSize:16,fontFamily:"inherit",background:P.bg,color:P.text,outline:"none",
  width:"100%",boxSizing:"border-box"};

const Inp=({label,type="text",value,onChange,placeholder,min,required})=>
  <label style={{display:"flex",flexDirection:"column",gap:5}}>
    <span style={{fontSize:13,fontWeight:700,color:P.muted,letterSpacing:0.3}}>
      {label}{required&&<span style={{color:P.red}}> *</span>}
    </span>
    <input type={type} value={value} onChange={e=>onChange(e.target.value)}
      placeholder={placeholder} min={min} style={IS}
      onFocus={e=>e.target.style.borderColor=P.text}
      onBlur={e=>e.target.style.borderColor=P.border}/>
  </label>;

const Sel=({label,value,onChange,options,required})=>
  <label style={{display:"flex",flexDirection:"column",gap:5}}>
    <span style={{fontSize:13,fontWeight:700,color:P.muted,letterSpacing:0.3}}>
      {label}{required&&<span style={{color:P.red}}> *</span>}
    </span>
    <select value={value} onChange={e=>onChange(e.target.value)} style={IS}>
      {options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  </label>;

const Confirm=({msg,onYes,onNo})=>
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",
    alignItems:"center",justifyContent:"center",zIndex:9999,padding:24}}>
    <Card style={{padding:28,maxWidth:360,width:"100%",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
      <p style={{fontSize:16,marginBottom:24,lineHeight:1.6}}>{msg}</p>
      <div style={{display:"flex",gap:12,justifyContent:"center"}}>
        <Btn v="ghost" onClick={onNo}>Cancel</Btn>
        <Btn v="danger" onClick={onYes}>Yes, delete</Btn>
      </div>
    </Card>
  </div>;

const Empty=({icon,title,sub,action})=>
  <div style={{textAlign:"center",padding:"40px 16px",color:P.muted}}>
    <div style={{fontSize:48,marginBottom:10}}>{icon}</div>
    <div style={{fontSize:17,fontWeight:700,color:P.text,marginBottom:6}}>{title}</div>
    <div style={{fontSize:13,marginBottom:20,lineHeight:1.5}}>{sub}</div>
    {action}
  </div>;

const BackBtn=({onClick})=>
  <button onClick={onClick} style={{background:"none",border:"none",cursor:"pointer",
    display:"flex",alignItems:"center",gap:4,color:P.muted,fontSize:15,
    fontFamily:"inherit",padding:0}}>← Back</button>;

// Toggle switch
const Toggle=({on,onChange,label,sub})=>
  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
    <div>
      <div style={{fontWeight:700,fontSize:15}}>{label}</div>
      {sub&&<div style={{fontSize:13,color:P.muted,marginTop:2}}>{sub}</div>}
    </div>
    <div onClick={()=>onChange(!on)} style={{
      width:52,height:28,borderRadius:14,background:on?P.green:P.border,
      cursor:"pointer",position:"relative",transition:"background .2s",flexShrink:0}}>
      <div style={{position:"absolute",top:3,left:on?25:3,width:22,height:22,
        borderRadius:"50%",background:"#fff",transition:"left .2s",
        boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/>
    </div>
  </div>;

// ── Weekly Schedule Picker ────────────────────────────────────────────────────
function WeeklySchedulePicker({schedule,onChange}) {
  const getEntry=slotId=>schedule.find(e=>e.slotId===slotId);
  const isOn=slotId=>!!getEntry(slotId);

  const toggleSlot=slotId=>{
    if(isOn(slotId)) onChange(schedule.filter(e=>e.slotId!==slotId));
    else onChange([...schedule,{slotId,days:[...ALL_DAYS]}]);
  };

  const setDays=(slotId,days)=>
    onChange(schedule.map(e=>e.slotId===slotId?{...e,days}:e));

  const toggleDay=(slotId,day)=>{
    const entry=getEntry(slotId); if(!entry)return;
    const next=entry.days.includes(day)
      ?entry.days.filter(d=>d!==day)
      :[...entry.days,day];
    if(next.length>0)setDays(slotId,next);
  };

  return <div style={{display:"flex",flexDirection:"column",gap:10}}>
    <div style={{fontSize:13,fontWeight:700,color:P.muted,letterSpacing:0.3}}>
      Schedule <span style={{color:P.red}}>*</span>
    </div>
    {SLOTS.map(slot=>{
      const on=isOn(slot.id);
      const entry=getEntry(slot.id);
      const allD=entry?.days.length===7;
      return <div key={slot.id}>
        {/* Slot row */}
        <div onClick={()=>toggleSlot(slot.id)} style={{display:"flex",alignItems:"center",
          justifyContent:"space-between",padding:"11px 14px",
          borderRadius:on?"12px 12px 0 0":"12px",
          border:`1.5px solid ${on?P.text:P.border}`,
          background:on?P.text:P.card,cursor:"pointer",
          borderBottom:on?"none":undefined}}>
          <div style={{display:"flex",alignItems:"center",gap:10,color:on?"#fff":P.text}}>
            <span style={{fontSize:22}}>{slot.icon}</span>
            <span style={{fontWeight:800,fontSize:15}}>{slot.label}</span>
            <span style={{fontSize:12,opacity:0.6}}>{slot.hint}</span>
          </div>
          <span style={{fontSize:12,fontWeight:800,color:on?"rgba(255,255,255,0.8)":P.muted}}>
            {on?"ON":"OFF"}
          </span>
        </div>
        {/* Day picker */}
        {on&&<div style={{padding:"10px 12px",background:P.cream,
          border:`1.5px solid ${P.text}`,borderTop:"none",borderRadius:"0 0 12px 12px",marginBottom:2}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {/* Every day shortcut */}
            <button onClick={()=>setDays(slot.id,[...ALL_DAYS])} style={{
              padding:"5px 10px",borderRadius:8,border:`1.5px solid ${P.border}`,
              background:allD?P.green:P.card,color:allD?"#fff":P.muted,
              fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
              Every day
            </button>
            {DAYS.map(d=>{
              const dayOn=entry.days.includes(d.id);
              return <button key={d.id} onClick={()=>toggleDay(slot.id,d.id)} style={{
                padding:"5px 9px",borderRadius:8,border:`1.5px solid ${P.border}`,
                background:dayOn&&!allD?P.amber:dayOn&&allD?P.cream:P.card,
                color:dayOn&&!allD?"#fff":dayOn&&allD?P.muted:P.muted,
                fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                {d.s}
              </button>;
            })}
          </div>
          {!allD&&entry.days.length>0&&<div style={{fontSize:11,color:P.amber,marginTop:6,fontWeight:700}}>
            {entry.days.map(d=>DAYS.find(x=>x.id===d)?.s).filter(Boolean).join(", ")}
          </div>}
        </div>}
      </div>;
    })}
    {schedule.length===0&&
      <div style={{color:P.red,fontSize:13}}>⚠ Enable at least one time slot.</div>}
  </div>;
}

// ── Prescription Form ─────────────────────────────────────────────────────────
function PrescriptionForm({existing,onSave,onCancel}) {
  const [salt,   setSalt]   = useState(existing?.saltName   ||"");
  const [cond,   setCond]   = useState(existing?.condition  ||"");
  const [doctor, setDoctor] = useState(existing?.doctorName ||"");
  const [sched,  setSched]  = useState(existing?.schedule   ||[]);
  const accent=existing?.accent||ACCENTS[Math.floor(Math.random()*ACCENTS.length)];
  const valid=salt.trim()&&sched.length>0&&sched.every(e=>e.days.length>0);

  return <div style={{maxWidth:480,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:24}}>
      <BackBtn onClick={onCancel}/>
      <h2 style={{fontSize:20,fontWeight:900,margin:0}}>
        {existing?"Edit Prescription":"Add Prescription"}
      </h2>
    </div>
    <Card style={{padding:"12px 16px",background:P.blueLight,border:`1px solid ${P.blue}`,marginBottom:20}}>
      <div style={{fontSize:13,color:P.blue,lineHeight:1.6}}>
        💡 Enter the <strong>salt / generic name</strong> from the prescription
        (e.g. "Metformin 500mg"). You'll add branded purchases separately.
      </div>
    </Card>
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <Inp label="Salt / Generic Name" value={salt} onChange={setSalt}
        placeholder="e.g. Metformin 500mg" required/>
      <Inp label="Prescribed for (condition)" value={cond} onChange={setCond}
        placeholder="e.g. Type 2 Diabetes"/>
      <Inp label="Doctor's Name (optional)" value={doctor} onChange={setDoctor}
        placeholder="e.g. Dr. Sharma"/>
      <WeeklySchedulePicker schedule={sched} onChange={setSched}/>
    </div>
    <div style={{display:"flex",gap:12,marginTop:28}}>
      <Btn v="ghost" onClick={onCancel} full>Cancel</Btn>
      <Btn v="success" onClick={()=>valid&&onSave({
        id:existing?.id||uid(),saltName:salt.trim(),condition:cond.trim(),
        doctorName:doctor.trim(),schedule:sched,accent,
        createdAt:existing?.createdAt||new Date().toISOString(),
      })} disabled={!valid} full>
        {existing?"Save Changes":"Add Prescription"}
      </Btn>
    </div>
  </div>;
}

// ── Stock Form ────────────────────────────────────────────────────────────────
function StockForm({prescriptions,existing,defaultRxId,onSave,onCancel}) {
  const initRx=existing?.prescriptionId||defaultRxId||prescriptions[0]?.id||"";
  const [rxId,  setRxId]  = useState(initRx);
  const [brand, setBrand] = useState(existing?.brandName  ||"");
  const [lot,   setLot]   = useState(existing?.lotNumber  ||"");
  const [exp,   setExp]   = useState(existing?.expiryDate ||"");
  const [qty,   setQty]   = useState(existing?.quantity?String(existing.quantity):"");
  const [eDate, setEDate] = useState(existing?.enteredDate||today());

  const valid=brand.trim()&&rxId&&qty&&Number(qty)>0;
  const rxOptions=prescriptions.map(r=>({v:r.id,l:`${r.saltName}${r.condition?` · ${r.condition}`:""}`}));
  if(!rxOptions.length)rxOptions.push({v:"",l:"— Add a prescription first —"});

  return <div style={{maxWidth:480,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:24}}>
      <BackBtn onClick={onCancel}/>
      <h2 style={{fontSize:20,fontWeight:900,margin:0}}>
        {existing?"Edit Purchase":"Add Purchase"}
      </h2>
    </div>
    <Card style={{padding:"12px 16px",background:P.amberLight,border:`1px solid ${P.amber}`,marginBottom:20}}>
      <div style={{fontSize:13,color:P.amber,lineHeight:1.6}}>
        💡 Add one entry per box or strip. Same salt, different brand — add separately.
        The app will tell you which to open first based on expiry.
      </div>
    </Card>
    {!prescriptions.length&&<Card style={{padding:"12px 16px",background:P.redLight,
      border:`1px solid ${P.red}`,marginBottom:16}}>
      <div style={{fontSize:13,color:P.red}}>⚠ Add a prescription first.</div>
    </Card>}
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <Sel label="Prescription (salt)" value={rxId} onChange={setRxId} options={rxOptions} required/>
      <Inp label="Brand Name" value={brand} onChange={setBrand}
        placeholder="e.g. Glucophage / Metlong / Generic" required/>
      <Inp label="Batch / Lot Number (optional)" value={lot} onChange={setLot}
        placeholder="e.g. LOT-2024-AB12"/>
      <Inp label="Expiry Date" type="date" value={exp} onChange={setExp}/>
      <Inp label="Quantity on hand (tablets / units)" type="number"
        value={qty} onChange={setQty} min="1" required/>
      <Inp label="Date this quantity was counted" type="date" value={eDate} onChange={setEDate}/>
    </div>
    <div style={{display:"flex",gap:12,marginTop:28}}>
      <Btn v="ghost" onClick={onCancel} full>Cancel</Btn>
      <Btn v="success" onClick={()=>valid&&onSave({
        id:existing?.id||uid(),prescriptionId:rxId,brandName:brand.trim(),
        lotNumber:lot.trim(),expiryDate:exp,quantity:Number(qty),
        enteredDate:eDate,addedAt:existing?.addedAt||new Date().toISOString(),
      })} disabled={!valid||!prescriptions.length} full>
        {existing?"Save Changes":"Add Purchase"}
      </Btn>
    </div>
  </div>;
}

// ── Prescription Detail ───────────────────────────────────────────────────────
function PrescriptionDetail({rx,stock,mode,dispatch,onBack,onEditRx,onAddStock,onEditStock}) {
  const [confirm,setConfirm]=useState(null);

  const all     =rxStock(stock,rx.id);
  const supply  =supplyInfo(rx,stock,mode);
  const runOut  =runOutDate(rx,stock,mode);
  const current =activeStock(rx,stock,mode);
  const supDays =supply?.days??0;
  const supColor=supDays>90?P.green:supDays>30?P.amber:supply?P.red:P.muted;

  return <div style={{maxWidth:540,margin:"0 auto"}}>
    {confirm?.t==="stock"&&<Confirm msg="Delete this purchase entry?"
      onYes={()=>{dispatch({type:"DEL_STOCK",id:confirm.id});setConfirm(null);}}
      onNo={()=>setConfirm(null)}/>}
    {confirm?.t==="rx"&&<Confirm msg={`Delete prescription "${rx.saltName}" and all its stock?`}
      onYes={()=>{dispatch({type:"DEL_RX",id:rx.id});onBack();}}
      onNo={()=>setConfirm(null)}/>}

    {/* Header */}
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
      <BackBtn onClick={onBack}/>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:12,height:12,borderRadius:"50%",background:rx.accent||P.green,flexShrink:0}}/>
          <h2 style={{fontSize:20,fontWeight:900,margin:0}}>{rx.saltName}</h2>
        </div>
        {rx.condition&&<div style={{fontSize:13,color:P.muted,marginTop:1,marginLeft:20}}>{rx.condition}</div>}
        {rx.doctorName&&<div style={{fontSize:13,color:P.blue,marginTop:1,marginLeft:20}}>👨‍⚕️ {rx.doctorName}</div>}
        <div style={{fontSize:12,color:P.muted,marginTop:2,marginLeft:20}}>{schedSummary(rx)}</div>
      </div>
      <Btn v="ghost" sz="sm" onClick={()=>onEditRx(rx)}>Edit</Btn>
      <Btn v="danger" sz="sm" onClick={()=>setConfirm({t:"rx"})}>🗑</Btn>
    </div>

    {/* Supply card */}
    <Card style={{padding:"18px 20px",marginBottom:16,
      background:supply&&supDays<=30?P.redLight:supply&&supDays<=90?P.amberLight:P.greenLight,
      border:`1px solid ${supColor}`}}>
      <div style={{fontSize:11,fontWeight:800,color:P.muted,letterSpacing:0.8,marginBottom:12}}>SUPPLY OVERVIEW</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        {[
          {label:"Days of supply",    val:supply?`${supply.days} days`:"No stock",big:true},
          {label:"Runs out on",       val:runOut?fmtDate(runOut):"—",big:false},
          {label:"Total units left",  val:supply?supply.total:0,big:false},
          {label:"Doses/week",        val:supply?supply.dpw:"—",big:false},
        ].map((s,i)=>(
          <div key={i} style={{padding:"10px 12px",background:"rgba(255,255,255,0.6)",borderRadius:10}}>

// ── Today screen ──────────────────────────────────────────────────────────────
function TodayScreen({prescriptions,stock,logs,mode,dispatch,goToRx}) {
  const nowH     =new Date().getHours();
  const curSlotId=nowH<12?"morning":nowH<16?"noon":nowH<20?"evening":"bed";

  // Build today's dose list from schedules
  const todayDoses=[];
  prescriptions.forEach(rx=>{
    todayEntries(rx).forEach(entry=>{
      const logKey=`${today()}_${rx.id}_${entry.slotId}`;
      const log=logs.find(l=>l.logKey===logKey);
      todayDoses.push({rx,slotId:entry.slotId,log});
    });
  });

  const markDose=(rx,slotId,status)=>dispatch({type:"LOG",rx,slotId,status});

  // Group by slot
  const grouped=SLOTS.map(slot=>({
    slot,items:todayDoses.filter(d=>d.slotId===slot.id),
  })).filter(g=>g.items.length>0);

  // Low supply alerts ≤ 30 days
  const alerts=prescriptions.filter(rx=>{
    const s=supplyInfo(rx,stock,mode); return s&&s.days<=30;
  });

  const dow=new Date().getDay();
  const dowLabel=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dow];

  return <div>
    {/* Header */}
    <div style={{background:P.text,color:"#fff",padding:"22px 20px 28px",
      borderRadius:"0 0 24px 24px",marginBottom:20}}>
      <div style={{fontSize:13,opacity:0.6,marginBottom:4}}>
        {new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})}
      </div>
      <div style={{fontSize:26,fontWeight:900}}>Daily Schedule</div>
      <div style={{marginTop:8,display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:13,opacity:0.7}}>{dowLabel}</span>
        <span style={{fontSize:11,opacity:0.6,background:"rgba(255,255,255,0.15)",
          padding:"2px 10px",borderRadius:10}}>
          {mode==="assume"?"Auto tracking":"Manual confirm"}
        </span>
      </div>
    </div>

    {/* Alerts */}
    {alerts.map(rx=>{
      const s=supplyInfo(rx,stock,mode);
      const run=runOutDate(rx,stock,mode);
      return <Card key={rx.id} style={{padding:"10px 14px",marginBottom:10,
        background:P.redLight,border:`1px solid ${P.red}`}}>
        <div style={{fontSize:14,color:P.red,lineHeight:1.5}}>
          ⚠ <strong>{rx.saltName}</strong> — only <strong>{s.days}d</strong> left.
          {run&&<> Runs out <strong>{fmtDate(run)}</strong>.</>}
        </div>
      </Card>;
    })}

    {/* Schedule */}
    {grouped.length===0
      ?<Empty icon="💊" title="Nothing scheduled today"
          sub={`No medicines scheduled for ${dowLabel}. Check your prescription schedules.`}/>
      :grouped.map(({slot,items})=><div key={slot.id} style={{marginBottom:26}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,
          paddingBottom:8,borderBottom:`1px solid ${P.border}`}}>
          <span style={{fontSize:22}}>{slot.icon}</span>
          <div>
            <span style={{fontWeight:900,fontSize:16,
              color:slot.id===curSlotId?P.text:P.muted}}>{slot.label}</span>
            <span style={{fontSize:13,color:P.muted,marginLeft:6}}>{slot.hint}</span>
          </div>
          {slot.id===curSlotId&&<Badge color="green" small>Now</Badge>}
        </div>

        {items.map(({rx,slotId,log})=>{
          const supply =supplyInfo(rx,stock,mode);
          const runOut =runOutDate(rx,stock,mode);
          const cur    =activeStock(rx,stock,mode);
          const supDays=supply?.days??0;
          const status =log?.status||"pending";

          return <Card key={rx.id+"_"+slotId} onClick={()=>goToRx(rx)}
            style={{padding:"14px 16px",marginBottom:10,cursor:"pointer",
              borderLeft:`4px solid ${rx.accent||P.green}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:900,fontSize:16,marginBottom:2}}>{rx.saltName}</div>
                {rx.condition&&<div style={{fontSize:12,color:P.muted,marginBottom:5}}>{rx.condition}</div>}
                {cur
                  ?<div style={{fontSize:14,marginBottom:4}}>
                      💊 <strong>{cur.brandName}</strong>
                      {cur.lotNumber&&<span style={{color:P.muted,fontWeight:400}}> · Lot {cur.lotNumber}</span>}
                    </div>
                  :<div style={{fontSize:13,color:P.red,marginBottom:4}}>⚠ No stock available</div>}
                {supply&&<div style={{fontSize:12,
                  color:supDays<=30?P.red:supDays<=90?P.amber:P.muted,
                  fontWeight:supDays<=30?700:400}}>
                  {supply.total} units · {supply.days}d supply
                  {runOut&&<> · Runs out <strong>{fmtDate(runOut)}</strong></>}
                </div>}
              </div>
              {/* Confirm mode: show Taken/Skip */}
              {mode==="confirm"&&<div style={{flexShrink:0,display:"flex",
                flexDirection:"column",gap:7,alignItems:"flex-end"}}>
                {status==="pending"
                  ?<>
                    <Btn v="success" sz="sm"
                      onClick={e=>{e.stopPropagation();markDose(rx,slotId,"taken");}}>✓ Taken</Btn>
                    <Btn v="ghost" sz="sm"
                      onClick={e=>{e.stopPropagation();markDose(rx,slotId,"skipped");}}>Skip</Btn>
                  </>
                  :<Badge color={status==="taken"?"green":"muted"} small>
                    {status==="taken"?"✓ Taken":"— Skipped"}</Badge>}
              </div>}
              {/* Assume mode: just a chevron */}
              {mode==="assume"&&
                <span style={{fontSize:20,color:P.muted,alignSelf:"center"}}>›</span>}
            </div>
          </Card>;
        })}
      </div>)
    }
  </div>;
}

// ── Settings ──────────────────────────────────────────────────────────────────
function SettingsView({data,dispatch}) {
  const [confirmClear,setConfirmClear]=useState(false);
  const mode=data.settings?.trackingMode||"assume";

  const exportData=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;
    a.download=`meditrack_${today()}.json`;a.click();URL.revokeObjectURL(url);
  };
  const importData=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{dispatch({type:"IMPORT",p:JSON.parse(ev.target.result)});alert("Imported!");}
      catch{alert("Could not read backup file.");}};r.readAsText(file);
  };

  return <div>
    {confirmClear&&<Confirm msg="Delete ALL data? Cannot be undone."
      onYes={()=>{dispatch({type:"CLEAR"});setConfirmClear(false);}}

          on={mode==="confirm"}

          sub='Today screen shows "Taken" and "Skip" buttons. Stock reduces only when confirmed.'/>

    <Card style={{padding:"16px 20px",background:P.cream}}>
      <div style={{fontSize:13,color:P.muted,lineHeight:1.8}}>
        <strong>How it works:</strong><br/>
        1. Add a <strong>Prescription</strong> — the salt your doctor prescribed + weekly schedule.<br/>
        2. Add <strong>Purchases</strong> — brand name, lot, expiry, quantity on hand.<br/>
        3. App shows which brand to open first (earliest expiry) and when stock runs out.<br/><br/>
        <strong>Privacy:</strong> All data stays on this device only.<br/><br/>
        <strong>Disclaimer:</strong> Personal tracking only. Always follow your doctor's instructions.

// ── Reducer ───────────────────────────────────────────────────────────────────
function reducer(state,action) {
  let next;
  switch(action.type) {
    case "ADD_RX":   next={...state,prescriptions:[...state.prescriptions,action.rx]}; break;
    case "UPD_RX":   next={...state,prescriptions:state.prescriptions.map(r=>r.id===action.rx.id?action.rx:r)}; break;
    case "DEL_RX":   next={...state,
      prescriptions:state.prescriptions.filter(r=>r.id!==action.id),
      stock:state.stock.filter(s=>s.prescriptionId!==action.id),
      logs:state.logs.filter(l=>l.prescriptionId!==action.id)}; break;
    case "ADD_STOCK": next={...state,stock:[...state.stock,action.item]}; break;
    case "UPD_STOCK": next={...state,stock:state.stock.map(s=>s.id===action.item.id?action.item:s)}; break;
    case "DEL_STOCK": next={...state,stock:state.stock.filter(s=>s.id!==action.id)}; break;
    case "LOG":{
      const logKey=`${today()}_${action.rx.id}_${action.slotId}`;
      const now=new Date();
      const takenAt=action.status==="taken"
        ?`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`:null;
      const newLog={id:uid(),logKey,prescriptionId:action.rx.id,date:today(),
        slotId:action.slotId,takenAt,status:action.status};
      const idx=state.logs.findIndex(l=>l.logKey===logKey);
      const logs=idx>=0?state.logs.map((l,i)=>i===idx?newLog:l):[...state.logs,newLog];
      // In confirm mode, reduce stock quantity on the active item
      let stock=state.stock;
      if(action.status==="taken"){
        const cur=rxStock(state.stock,action.rx.id)
          .find(item=>(Number(item.quantity)||0)>0);
        if(cur) stock=state.stock.map(s=>s.id===cur.id
          ?{...s,quantity:Math.max(0,Number(s.quantity)-1)}:s);
      }
      next={...state,logs,stock}; break;
    }
    case "SET_SETTING": next={...state,settings:{...state.settings,[action.key]:action.value}}; break;
    case "IMPORT":  next={...blank(),...action.p}; break;
    case "CLEAR":   next=blank(); break;
    default: return state;
  }
  persist(next);
  return next;
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [data,setData]=useState(()=>load());
  const [tab, setTab] =useState("today");
  const [view,setView]=useState(null);

  const act =useCallback(action=>setData(prev=>reducer(prev,action)),[]);
  const back=()=>setView(null);
  const mode=data.settings?.trackingMode||"assume";

  const wrap=children=>(
    <div style={{fontFamily:"Georgia,'Palatino Linotype',serif",background:P.bg,
      minHeight:"100vh",color:P.text,maxWidth:600,margin:"0 auto"}}>
      <div style={{padding:"20px 16px 40px"}}>{children}</div>
    </div>
  );

  if(view){
    const{s}=view;
    if(s==="add_rx"||s==="edit_rx") return wrap(
      <PrescriptionForm existing={view.rx}
        onSave={rx=>{act({type:view.rx?"UPD_RX":"ADD_RX",rx});back();}}
        onCancel={back}/>
    );
    if(s==="add_stock"||s==="edit_stock") return wrap(
      <StockForm prescriptions={data.prescriptions} existing={view.item}
        defaultRxId={view.defaultRxId}
        onSave={item=>{act({type:view.item?"UPD_STOCK":"ADD_STOCK",item});back();}}
        onCancel={back}/>
    );
    if(s==="rx_detail"){
      const rx=data.prescriptions.find(r=>r.id===view.rxId);
      if(!rx){back();return null;}
      return wrap(
        <PrescriptionDetail rx={rx} stock={data.stock} mode={mode} dispatch={act}
          onBack={back}
          onEditRx={r=>setView({s:"edit_rx",rx:r})}
          onAddStock={r=>setView({s:"add_stock",defaultRxId:r.id})}
          onEditStock={(item,r)=>setView({s:"edit_stock",item,defaultRxId:r.id})}/>
      );
    }
  }

  const content=()=>{
    if(tab==="today") return(
      <TodayScreen prescriptions={data.prescriptions} stock={data.stock}
        logs={data.logs} mode={mode} dispatch={act}
        goToRx={rx=>setView({s:"rx_detail",rxId:rx.id})}/>
    );
    if(tab==="prescriptions") return(
      <PrescriptionsScreen prescriptions={data.prescriptions} stock={data.stock}
        mode={mode} onSelect={rx=>setView({s:"rx_detail",rxId:rx.id})}
        onAdd={()=>setView({s:"add_rx"})}/>
    );
    if(tab==="purchases") return(
      <PurchasesScreen stock={data.stock} prescriptions={data.prescriptions}
        mode={mode} onAdd={()=>setView({s:"add_stock"})}
        onEdit={item=>setView({s:"edit_stock",item})}
        onDelete={id=>act({type:"DEL_STOCK",id})}/>
    );
    if(tab==="settings") return <SettingsView data={data} dispatch={act}/>;
  };

  return(
    <div style={{fontFamily:"Georgia,'Palatino Linotype',serif",background:P.bg,
      minHeight:"100vh",color:P.text,maxWidth:600,margin:"0 auto"}}>
      <div style={{padding:"20px 16px 90px"}}>{content()}</div>
      <BottomNav active={tab} setActive={setTab}/>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
