<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MediTrack</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#FAF7F2; font-family:Georgia,"Palatino Linotype",serif; }
    input,select,textarea,button { font-family:inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback } = React;

// ── Tokens ────────────────────────────────────────────────────────────────────
const P = {
  bg:"#FAF7F2", card:"#FFFFFF", cream:"#F5EFE4", border:"#E8DFD0",
  text:"#2C2416", muted:"#8A7A65",
  green:"#3D8C5F", greenLight:"#EAF5EE",
  amber:"#C07A1A", amberLight:"#FEF3DC",
  red:"#B03030",   redLight:"#FAEAEA",
  blue:"#1A5C8F",  blueLight:"#E8F2FA",
};
const ACCENTS = ["#3D8C5F","#1A5C8F","#7B4F9E","#C07A1A","#B03030","#2A7F8F","#8F5A2A","#5A7B2A"];

const SLOTS = [
  { id:"morning", label:"Morning",  icon:"🌅", hint:"8 AM"  },
  { id:"noon",    label:"Noon",     icon:"☀️", hint:"1 PM"  },
  { id:"evening", label:"Evening",  icon:"🌆", hint:"6 PM"  },
  { id:"bed",     label:"Bedtime",  icon:"🌙", hint:"9 PM"  },
];
const SLOT_MAP = Object.fromEntries(SLOTS.map(s=>[s.id,s]));

// ── Storage ───────────────────────────────────────────────────────────────────
// prescriptions: [{ id, saltName, condition, doctorName, slots[], accent }]
// stock:         [{ id, prescriptionId, brandName, lotNumber, expiryDate, quantity }]
const KEY   = "meditrack_v8";
const blank = () => ({ prescriptions:[], stock:[] });
const load  = () => {
  try { const r=localStorage.getItem(KEY); return r?{...blank(),...JSON.parse(r)}:blank(); }
  catch { return blank(); }
};
const persist = d => { try { localStorage.setItem(KEY,JSON.stringify(d)); } catch {} };
const uid   = () => Math.random().toString(36).slice(2)+Date.now().toString(36);
const today = () => new Date().toISOString().slice(0,10);
const addDays = (iso,n) => {
  const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
};
const fmtDate = iso => {
  if(!iso) return "—";
  return new Date(iso+"T12:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});
};
const daysUntil = iso => {
  if(!iso) return null;
  const n=new Date(); n.setHours(0,0,0,0);
  return Math.floor((new Date(iso+"T12:00:00")-n)/86400000);
};

// ── Business logic ─────────────────────────────────────────────────────────────
// Stock for a prescription sorted by earliest expiry first
const rxStock = (stock, rxId) =>
  stock.filter(s=>s.prescriptionId===rxId)
       .sort((a,b)=>(a.expiryDate||"9999").localeCompare(b.expiryDate||"9999"));

const totalUnits = (stock, rxId) =>
  rxStock(stock,rxId).reduce((s,m)=>s+(Number(m.quantity)||0),0);

const supplyInfo = (rx, stock) => {
  const dpd=(rx.slots||[]).length; if(!dpd) return null;
  const total=totalUnits(stock,rx.id);
  return { dpd, total, days:Math.floor(total/dpd) };
};

const runOutDate = (rx, stock) => {
  const s=supplyInfo(rx,stock); if(!s||!s.days) return null;
  return addDays(today(),s.days);
};

// Which stock item to use first (earliest expiry, non-zero qty)
const activeStock = (stock, rxId) =>
  rxStock(stock,rxId).find(s=>(Number(s.quantity)||0)>0);

// ── Atoms ─────────────────────────────────────────────────────────────────────
const Badge = ({color="muted",children,small}) => {
  const c={green:{bg:P.greenLight,fg:P.green},amber:{bg:P.amberLight,fg:P.amber},
           red:{bg:P.redLight,fg:P.red},blue:{bg:P.blueLight,fg:P.blue},
           muted:{bg:P.cream,fg:P.muted}}[color]||{bg:P.cream,fg:P.muted};
  return <span style={{background:c.bg,color:c.fg,padding:small?"2px 8px":"3px 11px",
    borderRadius:20,fontSize:small?11:12,fontWeight:700,
    display:"inline-flex",alignItems:"center",gap:3}}>{children}</span>;
};

const Btn = ({children,onClick,v="primary",sz="md",disabled,full,style:ex}) => {
  const size={lg:{f:17,p:"14px 24px"},md:{f:15,p:"10px 20px"},sm:{f:13,p:"7px 14px"}}[sz];
  const vars={
    primary:{bg:P.text,fg:"#fff",bd:"none"},success:{bg:P.green,fg:"#fff",bd:"none"},
    danger:{bg:P.red,fg:"#fff",bd:"none"},blue:{bg:P.blue,fg:"#fff",bd:"none"},
    ghost:{bg:"transparent",fg:P.text,bd:`1.5px solid ${P.border}`},
    subtle:{bg:P.cream,fg:P.text,bd:"none"}}[v];
  return <button onClick={onClick} disabled={disabled} style={{
    fontSize:size.f,padding:size.p,background:vars.bg,color:vars.fg,border:vars.bd,
    borderRadius:12,cursor:disabled?"not-allowed":"pointer",fontFamily:"inherit",
    fontWeight:700,display:"inline-flex",alignItems:"center",gap:6,
    opacity:disabled?0.5:1,width:full?"100%":"auto",justifyContent:"center",...ex}}>
    {children}
  </button>;
};

const Card = ({children,style,onClick}) =>
  <div onClick={onClick} style={{background:P.card,borderRadius:16,
    border:`1px solid ${P.border}`,boxShadow:"0 2px 8px rgba(0,0,0,0.04)",
    cursor:onClick?"pointer":undefined,...style}}>{children}</div>;

const IS = {padding:"11px 14px",borderRadius:10,border:`1.5px solid ${P.border}`,
  fontSize:16,fontFamily:"inherit",background:P.bg,color:P.text,
  outline:"none",width:"100%",boxSizing:"border-box"};

const Inp = ({label,type="text",value,onChange,placeholder,min,required}) =>
  <label style={{display:"flex",flexDirection:"column",gap:5}}>
    <span style={{fontSize:13,fontWeight:700,color:P.muted,letterSpacing:0.3}}>
      {label}{required&&<span style={{color:P.red}}> *</span>}
    </span>
    <input type={type} value={value} onChange={e=>onChange(e.target.value)}
      placeholder={placeholder} min={min} style={IS}
      onFocus={e=>e.target.style.borderColor=P.text}
      onBlur={e=>e.target.style.borderColor=P.border}/>
  </label>;

const Sel = ({label,value,onChange,options,required}) =>
  <label style={{display:"flex",flexDirection:"column",gap:5}}>
    <span style={{fontSize:13,fontWeight:700,color:P.muted,letterSpacing:0.3}}>
      {label}{required&&<span style={{color:P.red}}> *</span>}
    </span>
    <select value={value} onChange={e=>onChange(e.target.value)} style={IS}>
      {options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  </label>;

const Confirm = ({msg,onYes,onNo}) =>
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",
    alignItems:"center",justifyContent:"center",zIndex:9999,padding:24}}>
    <Card style={{padding:28,maxWidth:360,width:"100%",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
      <p style={{fontSize:16,marginBottom:24,lineHeight:1.6}}>{msg}</p>
      <div style={{display:"flex",gap:12,justifyContent:"center"}}>
        <Btn v="ghost" onClick={onNo}>Cancel</Btn>
        <Btn v="danger" onClick={onYes}>Yes, delete</Btn>
      </div>
    </Card>
  </div>;

const Empty = ({icon,title,sub,action}) =>
  <div style={{textAlign:"center",padding:"40px 16px",color:P.muted}}>
    <div style={{fontSize:48,marginBottom:10}}>{icon}</div>
    <div style={{fontSize:17,fontWeight:700,color:P.text,marginBottom:6}}>{title}</div>
    <div style={{fontSize:13,marginBottom:20,lineHeight:1.5}}>{sub}</div>
    {action}
  </div>;

const BackBtn = ({onClick}) =>
  <button onClick={onClick} style={{background:"none",border:"none",cursor:"pointer",
    display:"flex",alignItems:"center",gap:4,color:P.muted,fontSize:15,
    fontFamily:"inherit",padding:0}}>← Back</button>;

const SlotPicker = ({selected,onChange}) => {
  const toggle = id =>
    onChange(selected.includes(id)?selected.filter(s=>s!==id):[...selected,id]);
  return <div>
    <div style={{fontSize:13,fontWeight:700,color:P.muted,marginBottom:8,letterSpacing:0.3}}>
      When to take <span style={{color:P.red}}>*</span>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      {SLOTS.map(s=>{
        const on=selected.includes(s.id);
        return <button key={s.id} onClick={()=>toggle(s.id)} style={{
          padding:"14px 8px",borderRadius:14,border:`2px solid ${on?P.text:P.border}`,
          background:on?P.text:P.card,color:on?"#fff":P.text,cursor:"pointer",
          fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <span style={{fontSize:24}}>{s.icon}</span>
          <span style={{fontWeight:800,fontSize:14}}>{s.label}</span>
          <span style={{fontSize:11,opacity:0.6}}>{s.hint}</span>
        </button>;
      })}
    </div>
  </div>;
};

// ── Prescription Form ─────────────────────────────────────────────────────────
function PrescriptionForm({existing,onSave,onCancel}) {
  const [salt,    setSalt]    = useState(existing?.saltName    ||"");
  const [cond,    setCond]    = useState(existing?.condition   ||"");
  const [doctor,  setDoctor]  = useState(existing?.doctorName  ||"");
  const [slots,   setSlots]   = useState(existing?.slots       ||["morning"]);
  const accent = existing?.accent||ACCENTS[Math.floor(Math.random()*ACCENTS.length)];
  const valid  = salt.trim()&&slots.length>0;

  return <div style={{maxWidth:480,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:24}}>
      <BackBtn onClick={onCancel}/>
      <h2 style={{fontSize:20,fontWeight:900,margin:0}}>
        {existing?"Edit Prescription":"Add Prescription"}
      </h2>
    </div>

    <Card style={{padding:"12px 16px",background:P.blueLight,border:`1px solid ${P.blue}`,marginBottom:20}}>
      <div style={{fontSize:13,color:P.blue,lineHeight:1.6}}>
        💡 A prescription is what your doctor writes — the <strong>salt / generic name</strong>
        (e.g. "Metformin 500mg"). You'll add the actual branded medicines you purchase separately.
      </div>
    </Card>

    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <Inp label="Salt / Generic Name" value={salt} onChange={setSalt}
        placeholder="e.g. Metformin 500mg" required/>
      <Inp label="Prescribed for (condition)" value={cond} onChange={setCond}
        placeholder="e.g. Type 2 Diabetes / Blood Sugar Control"/>
      <Inp label="Doctor's Name (optional)" value={doctor} onChange={setDoctor}
        placeholder="e.g. Dr. Sharma"/>
      <SlotPicker selected={slots} onChange={setSlots}/>
      {slots.length===0&&
        <div style={{color:P.red,fontSize:13}}>⚠ Select at least one time slot.</div>}
    </div>
    <div style={{display:"flex",gap:12,marginTop:28}}>
      <Btn v="ghost" onClick={onCancel} full>Cancel</Btn>
      <Btn v="success" onClick={()=>valid&&onSave({
        id:existing?.id||uid(), saltName:salt.trim(), condition:cond.trim(),
        doctorName:doctor.trim(), slots, accent,
        createdAt:existing?.createdAt||new Date().toISOString(),
      })} disabled={!valid} full>
        {existing?"Save Changes":"Add Prescription"}
      </Btn>
    </div>
  </div>;
}

// ── Stock (Purchase) Form ─────────────────────────────────────────────────────
function StockForm({prescriptions,existing,defaultRxId,onSave,onCancel}) {
  const initRx = existing?.prescriptionId||defaultRxId||prescriptions[0]?.id||"";
  const [rxId,     setRxId]     = useState(initRx);
  const [brand,    setBrand]    = useState(existing?.brandName  ||"");
  const [lot,      setLot]      = useState(existing?.lotNumber  ||"");
  const [expiry,   setExpiry]   = useState(existing?.expiryDate ||"");
  const [quantity, setQuantity] = useState(existing?.quantity?String(existing.quantity):"");

  const valid = brand.trim()&&rxId&&quantity&&Number(quantity)>0;
  const rxOptions = prescriptions.map(r=>({v:r.id,l:`${r.saltName}${r.condition?` · ${r.condition}`:""}`}));
  if(!rxOptions.length) rxOptions.push({v:"",l:"— Add a prescription first —"});

  return <div style={{maxWidth:480,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:24}}>
      <BackBtn onClick={onCancel}/>
      <h2 style={{fontSize:20,fontWeight:900,margin:0}}>
        {existing?"Edit Purchase":"Add Purchase"}
      </h2>
    </div>

    <Card style={{padding:"12px 16px",background:P.amberLight,border:`1px solid ${P.amber}`,marginBottom:20}}>
      <div style={{fontSize:13,color:P.amber,lineHeight:1.6}}>
        💡 Add one entry per box or strip you purchased. Same salt, different brand?
        Add separate entries — the app will tell you which to open first based on expiry.
      </div>
    </Card>

    {!prescriptions.length&&<Card style={{padding:"12px 16px",background:P.redLight,
      border:`1px solid ${P.red}`,marginBottom:20}}>
      <div style={{fontSize:13,color:P.red}}>
        ⚠ No prescriptions yet — go to the Prescriptions tab and add one first.
      </div>
    </Card>}

    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <Sel label="Prescription (salt / generic)" value={rxId} onChange={setRxId}
        options={rxOptions} required/>
      <Inp label="Brand Name" value={brand} onChange={setBrand}
        placeholder="e.g. Glucophage / Metlong / Generic" required/>
      <Inp label="Batch / Lot Number (optional)" value={lot} onChange={setLot}
        placeholder="e.g. LOT-2024-AB12"/>
      <Inp label="Expiry Date" type="date" value={expiry} onChange={setExpiry}/>
      <Inp label="Quantity (tablets / units in this purchase)" type="number"
        value={quantity} onChange={setQuantity} min="1" required/>
    </div>
    <div style={{display:"flex",gap:12,marginTop:28}}>
      <Btn v="ghost" onClick={onCancel} full>Cancel</Btn>
      <Btn v="success" onClick={()=>valid&&onSave({
        id:existing?.id||uid(), prescriptionId:rxId,
        brandName:brand.trim(), lotNumber:lot.trim(),
        expiryDate:expiry, quantity:Number(quantity),
        addedAt:existing?.addedAt||new Date().toISOString(),
      })} disabled={!valid||!prescriptions.length} full>
        {existing?"Save Changes":"Add Purchase"}
      </Btn>
    </div>
  </div>;
}

// ── Prescription Detail ───────────────────────────────────────────────────────
function PrescriptionDetail({rx,stock,dispatch,onBack,onEditRx,onAddStock,onEditStock}) {
  const [confirm,setConfirm]=useState(null);

  const allStock  = rxStock(stock,rx.id);
  const supply    = supplyInfo(rx,stock);
  const runOut    = runOutDate(rx,stock);
  const current   = activeStock(stock,rx.id);
  const supDays   = supply?.days??0;
  const supColor  = supDays>90?P.green:supDays>30?P.amber:supply?P.red:P.muted;
  const slotLabels= (rx.slots||[]).map(s=>SLOT_MAP[s]?.label).join(" + ");

  return <div style={{maxWidth:540,margin:"0 auto"}}>
    {confirm?.t==="stock"&&<Confirm msg={`Delete this purchase entry?`}
      onYes={()=>{dispatch({type:"DEL_STOCK",id:confirm.id});setConfirm(null);}}
      onNo={()=>setConfirm(null)}/>}
    {confirm?.t==="rx"&&<Confirm msg={`Delete prescription "${rx.saltName}" and all its stock?`}
      onYes={()=>{dispatch({type:"DEL_RX",id:rx.id});onBack();}}
      onNo={()=>setConfirm(null)}/>}

    {/* Header */}
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
      <BackBtn onClick={onBack}/>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:12,height:12,borderRadius:"50%",background:rx.accent||P.green,flexShrink:0}}/>
          <h2 style={{fontSize:20,fontWeight:900,margin:0}}>{rx.saltName}</h2>
        </div>
        {rx.condition&&<div style={{fontSize:13,color:P.muted,marginTop:2,marginLeft:20}}>{rx.condition}</div>}
        {rx.doctorName&&<div style={{fontSize:13,color:P.blue,marginTop:1,marginLeft:20}}>👨‍⚕️ {rx.doctorName}</div>}
      </div>
      <Btn v="ghost" sz="sm" onClick={()=>onEditRx(rx)}>Edit</Btn>
      <Btn v="danger" sz="sm" onClick={()=>setConfirm({t:"rx"})}>🗑</Btn>
    </div>

    {/* Supply card */}
    <Card style={{padding:"18px 20px",marginBottom:16,
      background:supply&&supDays<=30?P.redLight:supply&&supDays<=90?P.amberLight:P.greenLight,
      border:`1px solid ${supColor}`}}>
      <div style={{fontSize:11,fontWeight:800,color:P.muted,letterSpacing:0.8,marginBottom:12}}>
        SUPPLY OVERVIEW
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        {[
          {label:"Days of supply",   val:supply?`${supply.days} days`:"No stock", big:true },
          {label:"Runs out on",      val:runOut?fmtDate(runOut):"—",              big:false},
          {label:"Total units left", val:supply?supply.total:0,                   big:false},
          {label:"Doses per day",    val:supply?supply.dpd:"—",                   big:false},
        ].map((s,i)=>(
          <div key={i} style={{padding:"10px 12px",background:"rgba(255,255,255,0.6)",borderRadius:10}}>
            <div style={{fontSize:i===0?26:20,fontWeight:900,color:i===0?supColor:P.text}}>{s.val}</div>
            <div style={{fontSize:11,color:P.muted,marginTop:2}}>{s.label}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:13,color:P.muted}}>Schedule: {slotLabels||"—"}</div>
    </Card>

    {/* Open now */}
    {current&&<Card style={{padding:"14px 16px",marginBottom:16,border:`2px solid ${P.green}`}}>
      <div style={{fontSize:11,fontWeight:800,color:P.green,letterSpacing:0.8,marginBottom:6}}>
        🟢 OPEN THIS NOW
      </div>
      <div style={{fontWeight:800,fontSize:16}}>{current.brandName}</div>
      <div style={{fontSize:12,color:P.muted,marginTop:1}}>Same salt as: {rx.saltName}</div>
      <div style={{fontSize:13,color:P.muted,marginTop:6,display:"flex",gap:14,flexWrap:"wrap"}}>
        {current.lotNumber&&<span>Lot: <strong style={{color:P.text}}>{current.lotNumber}</strong></span>}
        <span>Expiry: <strong style={{color:P.text}}>{fmtDate(current.expiryDate)}</strong></span>
        <span>Qty: <strong style={{color:P.text}}>{current.quantity} units</strong></span>
      </div>
    </Card>}

    {/* Stock list */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontSize:11,fontWeight:800,color:P.muted,letterSpacing:0.8}}>
        ALL PURCHASES — OPEN EARLIEST EXPIRY FIRST
      </div>
      <Btn v="subtle" sz="sm" onClick={()=>onAddStock(rx)}>+ Add</Btn>
    </div>

    {allStock.length===0
      ?<Empty icon="📦" title="No purchases yet"
          sub="Add the medicines you've bought for this prescription."
          action={<Btn v="primary" onClick={()=>onAddStock(rx)}>+ Add Purchase</Btn>}/>
      :allStock.map((s,idx)=>{
        const d=daysUntil(s.expiryDate);
        const expColor=d===null?"muted":d<0?"red":d<=30?"red":d<=90?"amber":"green";
        const isCurrent=s.id===current?.id;
        return <Card key={s.id} style={{padding:"14px 16px",marginBottom:10,
          borderLeft:`4px solid ${isCurrent?P.green:P.amber}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:5}}>
                <span style={{fontSize:12,fontWeight:800,color:P.muted,
                  background:P.cream,borderRadius:6,padding:"1px 7px"}}>#{idx+1}</span>
                <span style={{fontWeight:800,fontSize:15}}>{s.brandName}</span>
                {isCurrent&&<Badge color="green" small>🟢 Open now</Badge>}
                {!isCurrent&&<Badge color="muted" small>📦 Next</Badge>}
                {d!==null&&<Badge color={expColor} small>
                  {d<0?`Expired ${Math.abs(d)}d ago`:d===0?"Expires today":`Exp ${d}d`}
                </Badge>}
              </div>
              <div style={{fontSize:12,color:P.muted,marginBottom:4}}>
                Same salt: <em>{rx.saltName}</em>
              </div>
              <div style={{fontSize:13,color:P.muted,display:"flex",gap:14,flexWrap:"wrap"}}>
                {s.lotNumber&&<span>Lot: <strong style={{color:P.text}}>{s.lotNumber}</strong></span>}
                <span>Expiry: <strong style={{color:P.text}}>{fmtDate(s.expiryDate)}</strong></span>
                <span>Qty: <strong style={{color:P.text}}>{s.quantity} units</strong></span>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6,flexShrink:0}}>
              <Btn v="ghost" sz="sm" onClick={()=>onEditStock(s,rx)}>✏️</Btn>
              <Btn v="ghost" sz="sm" onClick={()=>setConfirm({t:"stock",id:s.id})}>🗑</Btn>
            </div>
          </div>
        </Card>;
      })
    }
  </div>;
}

// ── Prescriptions screen ──────────────────────────────────────────────────────
function PrescriptionsScreen({prescriptions,stock,onSelect,onAdd}) {
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <h2 style={{fontSize:22,fontWeight:900,margin:0}}>Prescriptions</h2>
      <Btn v="primary" sz="sm" onClick={onAdd}>+ Add</Btn>
    </div>

    {prescriptions.length===0
      ?<Empty icon="📋" title="No prescriptions yet"
          sub={'Add a prescription like "Metformin 500mg for Diabetes" — then add the brands you buy under it.'}
          action={<Btn v="primary" onClick={onAdd}>+ Add Prescription</Btn>}/>
      :prescriptions.map(rx=>{
        const supply  =supplyInfo(rx,stock);
        const runOut  =runOutDate(rx,stock);
        const current =activeStock(stock,rx.id);
        const supDays =supply?.days??0;
        const supColor=supDays>90?"green":supDays>30?"amber":supply?"red":"muted";
        const packCount=stock.filter(s=>s.prescriptionId===rx.id).length;
        const slotIcons=(rx.slots||[]).map(s=>SLOT_MAP[s]?.icon).join(" ");

        return <Card key={rx.id} onClick={()=>onSelect(rx)}
          style={{padding:"16px 18px",marginBottom:12,cursor:"pointer",
            borderLeft:`4px solid ${rx.accent||P.green}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:3}}>
                <span style={{fontWeight:900,fontSize:17}}>{rx.saltName}</span>
                {supply
                  ?<Badge color={supColor} small>{supply.days}d · {supply.total} units</Badge>
                  :<Badge color="muted" small>No stock</Badge>}
              </div>
              {rx.condition&&<div style={{fontSize:13,color:P.muted,marginBottom:2}}>{rx.condition}</div>}
              {rx.doctorName&&<div style={{fontSize:12,color:P.blue,marginBottom:5}}>👨‍⚕️ {rx.doctorName}</div>}
              {current&&<div style={{fontSize:13,color:P.green,fontWeight:700,marginBottom:2}}>
                🟢 {current.brandName}{current.lotNumber?` · Lot ${current.lotNumber}`:""} · {current.quantity} units
              </div>}
              <div style={{fontSize:12,color:supDays<=30&&supply?P.red:P.muted,marginTop:3}}>
                {runOut&&<>Runs out: <strong>{fmtDate(runOut)}</strong> · </>}
                {packCount} purchase{packCount!==1?"s":""} · {slotIcons}
              </div>
            </div>
            <span style={{fontSize:20,color:P.muted,alignSelf:"center"}}>›</span>
          </div>
        </Card>;
      })
    }
  </div>;
}

// ── Purchases screen ──────────────────────────────────────────────────────────
function PurchasesScreen({stock,prescriptions,onAdd,onEdit,onDelete}) {
  const [search,    setSearch]    = useState("");
  const [filterRx,  setFilterRx]  = useState("all");
  const [confirm,   setConfirm]   = useState(null);

  const rxOptions=[{v:"all",l:"All Prescriptions"},...prescriptions.map(r=>({v:r.id,l:r.saltName}))];
  const getRx=id=>prescriptions.find(r=>r.id===id);

  const filtered=stock
    .filter(s=>{
      const matchSearch=!search
        ||s.brandName.toLowerCase().includes(search.toLowerCase())
        ||s.lotNumber?.toLowerCase().includes(search.toLowerCase());
      const matchRx=filterRx==="all"||s.prescriptionId===filterRx;
      return matchSearch&&matchRx;
    })
    .sort((a,b)=>(a.expiryDate||"9999").localeCompare(b.expiryDate||"9999"));

  return <div>
    {confirm&&<Confirm msg={`Delete this purchase entry?`}
      onYes={()=>{onDelete(confirm.id);setConfirm(null);}} onNo={()=>setConfirm(null)}/>}

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <h2 style={{fontSize:22,fontWeight:900,margin:0}}>Purchases</h2>
      <Btn v="primary" sz="sm" onClick={onAdd}>+ Add</Btn>
    </div>

    <input value={search} onChange={e=>setSearch(e.target.value)}
      placeholder="🔍 Search brand or lot number…"
      style={{...IS,marginBottom:10}}/>

    <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
      {rxOptions.map(o=>(
        <button key={o.v} onClick={()=>setFilterRx(o.v)} style={{
          padding:"6px 14px",borderRadius:20,border:`1.5px solid ${P.border}`,
          background:filterRx===o.v?P.text:P.card,color:filterRx===o.v?"#fff":P.muted,
          fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",fontSize:13,
          fontFamily:"inherit",flexShrink:0}}>{o.l}</button>
      ))}
    </div>

    {filtered.length===0
      ?<Empty icon="📦" title="No purchases found"
          sub="Add a purchase to track stock."
          action={<Btn v="primary" onClick={onAdd}>+ Add Purchase</Btn>}/>
      :filtered.map(s=>{
        const rx=getRx(s.prescriptionId);
        const d=daysUntil(s.expiryDate);
        const expColor=d===null?"muted":d<0?"red":d<=30?"red":d<=90?"amber":"green";
        return <Card key={s.id} style={{padding:"14px 16px",marginBottom:10,
          borderLeft:`4px solid ${rx?.accent||P.muted}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:5}}>
                <span style={{fontWeight:800,fontSize:15}}>{s.brandName}</span>
                {d!==null&&<Badge color={expColor} small>
                  {d<0?`Expired ${Math.abs(d)}d ago`:d===0?"Expires today":`Exp ${d}d`}
                </Badge>}
              </div>
              {rx&&<div style={{fontSize:12,fontWeight:700,color:rx.accent||P.muted,marginBottom:4}}>
                ● {rx.saltName}{rx.condition?` · ${rx.condition}`:""}
              </div>}
              <div style={{fontSize:13,color:P.muted,display:"flex",gap:14,flexWrap:"wrap"}}>
                {s.lotNumber&&<span>Lot: <strong style={{color:P.text}}>{s.lotNumber}</strong></span>}
                <span>Expiry: <strong style={{color:P.text}}>{fmtDate(s.expiryDate)}</strong></span>
                <span>Qty: <strong style={{color:P.text}}>{s.quantity} units</strong></span>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6,flexShrink:0}}>
              <Btn v="ghost" sz="sm" onClick={()=>onEdit(s)}>✏️</Btn>
              <Btn v="ghost" sz="sm" onClick={()=>setConfirm({id:s.id})}>🗑</Btn>
            </div>
          </div>
        </Card>;
      })
    }
  </div>;
}

// ── Today screen ──────────────────────────────────────────────────────────────
function TodayScreen({prescriptions,stock,goToRx}) {
  const nowH     =new Date().getHours();
  const curSlotId=nowH<12?"morning":nowH<16?"noon":nowH<20?"evening":"bed";
  const scheduled=prescriptions.filter(r=>(r.slots||[]).length>0);

  const alerts=scheduled.filter(rx=>{
    const s=supplyInfo(rx,stock); return s&&s.days<=30;
  });

  const grouped=SLOTS.map(slot=>({
    slot, rxs:scheduled.filter(r=>r.slots.includes(slot.id)),
  })).filter(g=>g.rxs.length>0);

  return <div>
    {/* Header */}
    <div style={{background:P.text,color:"#fff",padding:"22px 20px 28px",
      borderRadius:"0 0 24px 24px",marginBottom:20}}>
      <div style={{fontSize:13,opacity:0.6,marginBottom:4}}>
        {new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"})}
      </div>
      <div style={{fontSize:26,fontWeight:900}}>Daily Schedule</div>
      <div style={{fontSize:13,opacity:0.7,marginTop:4}}>
        {scheduled.length} prescription{scheduled.length!==1?"s":""}
      </div>
    </div>

    {/* Low supply alerts */}
    {alerts.map(rx=>{
      const s=supplyInfo(rx,stock);
      const run=runOutDate(rx,stock);
      return <Card key={rx.id} style={{padding:"10px 14px",marginBottom:10,
        background:P.redLight,border:`1px solid ${P.red}`}}>
        <div style={{fontSize:14,color:P.red,lineHeight:1.5}}>
          ⚠ <strong>{rx.saltName}</strong> — only <strong>{s.days} days</strong> left.
          {run&&<> Runs out <strong>{fmtDate(run)}</strong>.</>}
        </div>
      </Card>;
    })}

    {grouped.length===0
      ?<Empty icon="💊" title="Nothing scheduled"
          sub="Add a prescription and set a schedule to see it here."/>
      :grouped.map(({slot,rxs})=>(
        <div key={slot.id} style={{marginBottom:28}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,
            paddingBottom:8,borderBottom:`1px solid ${P.border}`}}>
            <span style={{fontSize:22}}>{slot.icon}</span>
            <div>
              <span style={{fontWeight:900,fontSize:16,
                color:slot.id===curSlotId?P.text:P.muted}}>{slot.label}</span>
              <span style={{fontSize:13,color:P.muted,marginLeft:6}}>{slot.hint}</span>
            </div>
            {slot.id===curSlotId&&<Badge color="green" small>Now</Badge>}
          </div>

          {rxs.map(rx=>{
            const supply =supplyInfo(rx,stock);
            const runOut =runOutDate(rx,stock);
            const current=activeStock(stock,rx.id);
            const supDays=supply?.days??0;

            return <Card key={rx.id} onClick={()=>goToRx(rx)}
              style={{padding:"14px 16px",marginBottom:10,cursor:"pointer",
                borderLeft:`4px solid ${rx.accent||P.green}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{flex:1}}>
                  {/* Salt name */}
                  <div style={{fontWeight:900,fontSize:16,marginBottom:2}}>{rx.saltName}</div>
                  {rx.condition&&<div style={{fontSize:12,color:P.muted,marginBottom:6}}>{rx.condition}</div>}

                  {/* Which brand to take */}
                  {current
                    ?<div style={{fontSize:14,marginBottom:6}}>
                        💊 <strong>{current.brandName}</strong>
                        {current.lotNumber&&
                          <span style={{color:P.muted,fontWeight:400}}> · Lot {current.lotNumber}</span>}
                        <div style={{fontSize:12,color:P.muted,marginTop:1}}>
                          Same salt as prescribed — different brand, same medicine
                        </div>
                      </div>
                    :<div style={{fontSize:13,color:P.red,marginBottom:6}}>⚠ No stock available</div>}

                  {/* Supply line */}
                  {supply
                    ?<div style={{fontSize:13,
                        color:supDays<=30?P.red:supDays<=90?P.amber:P.muted,
                        fontWeight:supDays<=30?700:400}}>
                        {supply.total} units · {supply.days}d supply
                        {runOut&&<> · Runs out <strong>{fmtDate(runOut)}</strong></>}
                      </div>
                    :<div style={{fontSize:13,color:P.muted}}>No stock entered</div>}
                </div>
                <span style={{fontSize:20,color:P.muted,alignSelf:"center"}}>›</span>
              </div>
            </Card>;
          })}
        </div>
      ))
    }
  </div>;
}

// ── Settings ──────────────────────────────────────────────────────────────────
function SettingsView({data,dispatch}) {
  const [confirmClear,setConfirmClear]=useState(false);
  const exportData=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;
    a.download=`meditrack_${today()}.json`;a.click();URL.revokeObjectURL(url);
  };
  const importData=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{dispatch({type:"IMPORT",p:JSON.parse(ev.target.result)});alert("Imported!");}
      catch{alert("Could not read backup file.");}};
    r.readAsText(file);
  };
  return <div>
    {confirmClear&&<Confirm msg="Delete ALL data? Cannot be undone."
      onYes={()=>{dispatch({type:"CLEAR"});setConfirmClear(false);}} onNo={()=>setConfirmClear(false)}/>}
    <h2 style={{fontSize:22,fontWeight:900,marginBottom:20}}>Settings</h2>
    <Card style={{padding:"16px 20px",marginBottom:14}}>
      <div style={{fontWeight:800,fontSize:15,marginBottom:14}}>Backup & Restore</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Btn v="subtle" onClick={exportData} full>⬇️ Export Backup (JSON)</Btn>
        <label style={{display:"flex",flexDirection:"column",gap:5}}>
          <span style={{fontSize:13,fontWeight:700,color:P.muted}}>Import from backup</span>
          <input type="file" accept=".json" onChange={importData} style={{fontSize:14,fontFamily:"inherit"}}/>
        </label>
        <Btn v="danger" onClick={()=>setConfirmClear(true)} full>🗑 Clear All Data</Btn>
      </div>
    </Card>
    <Card style={{padding:"16px 20px",background:P.cream}}>
      <div style={{fontSize:13,color:P.muted,lineHeight:1.8}}>
        <strong>How it works:</strong><br/>
        1. Add a <strong>Prescription</strong> — the salt/generic name your doctor prescribed.<br/>
        2. Add <strong>Purchases</strong> — any brand you bought for that salt, with lot number, expiry and quantity.<br/>
        3. The app calculates days of supply and tells you which brand to open first (earliest expiry).<br/><br/>
        <strong>Privacy:</strong> All data stays on this device only.<br/><br/>
        <strong>Disclaimer:</strong> For personal tracking only. Always follow your doctor's or pharmacist's instructions.
      </div>
    </Card>
  </div>;
}

// ── Bottom Nav ────────────────────────────────────────────────────────────────
const NAV=[
  {id:"today",         icon:"🏠", label:"Today"},
  {id:"prescriptions", icon:"📋", label:"Rx"},
  {id:"purchases",     icon:"📦", label:"Purchases"},
  {id:"settings",      icon:"⚙️", label:"Settings"},
];
function BottomNav({active,setActive}) {
  return <nav style={{position:"fixed",bottom:0,left:0,right:0,background:P.card,
    borderTop:`1px solid ${P.border}`,display:"flex",justifyContent:"space-around",
    padding:"8px 0 12px",zIndex:100,maxWidth:600,margin:"0 auto"}}>
    {NAV.map(n=>(
      <button key={n.id} onClick={()=>setActive(n.id)} style={{display:"flex",
        flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",
        cursor:"pointer",padding:"4px 10px",color:active===n.id?P.text:P.muted,fontFamily:"inherit"}}>
        <span style={{fontSize:20}}>{n.icon}</span>
        <span style={{fontSize:10,fontWeight:active===n.id?800:500}}>{n.label}</span>
        {active===n.id&&<div style={{width:20,height:3,borderRadius:2,background:P.text,marginTop:1}}/>}
      </button>
    ))}
  </nav>;
}

// ── Reducer ───────────────────────────────────────────────────────────────────
function reducer(state,action) {
  let next;
  switch(action.type) {
    case "ADD_RX":    next={...state,prescriptions:[...state.prescriptions,action.rx]}; break;
    case "UPD_RX":    next={...state,prescriptions:state.prescriptions.map(r=>r.id===action.rx.id?action.rx:r)}; break;
    case "DEL_RX":    next={...state,
      prescriptions:state.prescriptions.filter(r=>r.id!==action.id),
      stock:state.stock.filter(s=>s.prescriptionId!==action.id)}; break;
    case "ADD_STOCK":  next={...state,stock:[...state.stock,action.item]}; break;
    case "UPD_STOCK":  next={...state,stock:state.stock.map(s=>s.id===action.item.id?action.item:s)}; break;
    case "DEL_STOCK":  next={...state,stock:state.stock.filter(s=>s.id!==action.id)}; break;
    case "IMPORT":    next={...blank(),...action.p}; break;
    case "CLEAR":     next=blank(); break;
    default: return state;
  }
  persist(next);
  return next;
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [data,setData]=useState(()=>load());
  const [tab, setTab] =useState("today");
  const [view,setView]=useState(null);

  const act  = useCallback(action=>setData(prev=>reducer(prev,action)),[]);
  const back = ()=>setView(null);

  const wrap = children=>(
    <div style={{fontFamily:"Georgia,'Palatino Linotype',serif",background:P.bg,
      minHeight:"100vh",color:P.text,maxWidth:600,margin:"0 auto"}}>
      <div style={{padding:"20px 16px 40px"}}>{children}</div>
    </div>
  );

  if(view) {
    const{s}=view;

    if(s==="add_rx"||s==="edit_rx") return wrap(
      <PrescriptionForm existing={view.rx}
        onSave={rx=>{act({type:view.rx?"UPD_RX":"ADD_RX",rx});back();}}
        onCancel={back}/>
    );

    if(s==="add_stock"||s==="edit_stock") return wrap(
      <StockForm prescriptions={data.prescriptions} existing={view.item}
        defaultRxId={view.defaultRxId}
        onSave={item=>{act({type:view.item?"UPD_STOCK":"ADD_STOCK",item});back();}}
        onCancel={back}/>
    );

    if(s==="rx_detail") {
      const rx=data.prescriptions.find(r=>r.id===view.rxId);
      if(!rx){back();return null;}
      return wrap(
        <PrescriptionDetail rx={rx} stock={data.stock} dispatch={act}
          onBack={back}
          onEditRx={r=>setView({s:"edit_rx",rx:r})}
          onAddStock={r=>setView({s:"add_stock",defaultRxId:r.id})}
          onEditStock={(item,r)=>setView({s:"edit_stock",item,defaultRxId:r.id})}/>
      );
    }
  }

  const content=()=>{
    if(tab==="today") return(
      <TodayScreen prescriptions={data.prescriptions} stock={data.stock}
        goToRx={rx=>setView({s:"rx_detail",rxId:rx.id})}/>
    );
    if(tab==="prescriptions") return(
      <PrescriptionsScreen prescriptions={data.prescriptions} stock={data.stock}
        onSelect={rx=>setView({s:"rx_detail",rxId:rx.id})}
        onAdd={()=>setView({s:"add_rx"})}/>
    );
    if(tab==="purchases") return(
      <PurchasesScreen stock={data.stock} prescriptions={data.prescriptions}
        onAdd={()=>setView({s:"add_stock"})}
        onEdit={item=>setView({s:"edit_stock",item})}
        onDelete={id=>act({type:"DEL_STOCK",id})}/>
    );
    if(tab==="settings") return <SettingsView data={data} dispatch={act}/>;
  };

  return(
    <div style={{fontFamily:"Georgia,'Palatino Linotype',serif",background:P.bg,
      minHeight:"100vh",color:P.text,maxWidth:600,margin:"0 auto"}}>
      <div style={{padding:"20px 16px 90px"}}>{content()}</div>
      <BottomNav active={tab} setActive={setTab}/>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
